name: Build, Push and Deploy

# SECURITY — read before editing this file:
# This repo is public. The self-hosted runner (labels: self-hosted, enois, docker-prod4)
# has NO docker.sock mount and only talks to Portainer's HTTP API with scoped credentials.
# It must NEVER be targeted by a job that runs on `pull_request` — a fork PR would then
# execute arbitrary workflow code with access to our infra ("pwn request"). The deploy job
# below is gated to `push`/`workflow_dispatch` on protected branches only. PR validation
# always runs on GitHub-hosted `ubuntu-latest` and never touches secrets.

on:
  push:
    branches:
      - main
      - qa
  pull_request:
    branches:
      - main
      - qa
  workflow_dispatch:

env:
  HARBOR_REGISTRY: harbor.b7cloud.top
  HARBOR_PROJECT: enois
  IMAGE_NAME: backend
  CONTAINER_NAME: enois-qa-backend
  PORTAINER_ENDPOINT_ID: 8

permissions:
  contents: read

jobs:
  # ===========================================================================
  # Validação de build em PR (sempre hosted, nunca self-hosted, sem credenciais)
  # ===========================================================================
  validate-pr-build:
    name: 🧪 Validar build (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⚙️ Configurar Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: 🧪 Build sem push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: enois/backend:pr-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # Full test suite on every PR. The image build skips tests and the schema check only boots the
  # context, so before this job a broken test could reach qa unnoticed. PR only: never gates a deploy.
  # ===========================================================================
  test-suite:
    name: 🧪 Testes (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ☕ JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: 🧪 mvnw test
        run: ./mvnw -B -q test

  # ===========================================================================
  # Schema check: boot against MariaDB 11.4 (the production engine) built only from the Flyway
  # migrations (ddl-auto=validate). A migration MariaDB refuses, or an entity without its
  # migration, fails here, not in prod. The SPRING_* env vars override the test profile's H2.
  # ===========================================================================
  schema-check:
    name: 🧪 Schema x migrations
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4@sha256:250e1609e93c0e6aecf64bfbab2d84d5e89d2481540fe77447ff6c855c3b1873
        env:
          MARIADB_ROOT_PASSWORD: schema-check
          MARIADB_DATABASE: enois
          MARIADB_USER: enois
          MARIADB_PASSWORD: schema-check
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ☕ JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: 🧪 Boot with schema validation (MariaDB)
        env:
          # Same driver and dialect as application-prd.properties.
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/enois?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
          SPRING_DATASOURCE_USERNAME: enois
          SPRING_DATASOURCE_PASSWORD: schema-check
          SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MariaDBDialect
        run: ./mvnw -B -q -Dtest=RedeApplicationTests test

  # ===========================================================================
  # Build + Push para Harbor (push/workflow_dispatch em main ou qa, hosted runner)
  # ===========================================================================
  build-and-push:
    name: 🐳 Build & Push → Harbor
    needs: schema-check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      branch: ${{ steps.vars.outputs.branch }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🏷️ Definir tags
        id: vars
        env:
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          SHA_SHORT=$(echo "${COMMIT_SHA}" | cut -c1-7)
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${BRANCH}-${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: ⚙️ Configurar Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: 🔑 Login no Harbor
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # A poda vem ANTES do build: o push é o que esbarra na cota, então limpar depois seria
      # tarde demais — e, com o registro cheio, o push falha e a poda nunca roda (foi assim que a
      # QA ficou horas sem receber código). Limpando primeiro, este build tem espaço para subir.
      #
      # Mantém prod atual + 1 backup, a tag `main`, a QA mais recente e a tag deste build; apaga
      # o resto. Não derruba a run: uma falha aqui não pode impedir o deploy de um build válido.
      - name: 🧹 Podar imagens antigas no Harbor
        env:
          HARBOR_USER: ${{ secrets.HARBOR_USER }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          CURRENT_TAG: ${{ steps.vars.outputs.image_tag }}
          KEEP_PROD: "2"
        run: |
          if ! bash .github/scripts/harbor-retention.sh; then
            echo "::warning::A poda do Harbor falhou; este build segue, mas o registro não foi limpo."
          fi

      # push:true direto no buildx (buildkit) dá 400 no token service do Harbor com
      # multi-tag num push só (bug conhecido buildkit x Harbor 2.11 — não é bug nosso,
      # não tocar na config do Harbor, que funciona normal pras pipes do GitLab).
      # Fix: build local (load) + docker push classico por tag, igual ao fluxo do GitLab.
      - name: 🚀 Build (local, sem push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          # CA do gateway de chamadas, quando houver: o salto até ele é TLS entre
          # hosts e o certificado é nosso, não de uma autoridade pública. Vazio
          # (o padrão) produz a mesma imagem de antes.
          build-args: |
            EPAPO_GATEWAY_CA_B64=${{ secrets.EPAPO_GATEWAY_CA_B64 }}
          tags: |
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.branch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # O Dockerfile só instala o CA quando o build-arg vem preenchido: secret vazio,
      # renomeado ou fora do contexto produz a imagem de antes, sem erro. O sintoma
      # aparece longe daqui — a primeira entrada em sala falha com erro de certificado
      # e o log do build estava verde. Quando o secret existe, a imagem tem de tê-lo.
      - name: 🔐 Conferir o CA do gateway na imagem
        env:
          EPAPO_GATEWAY_CA_B64: ${{ secrets.EPAPO_GATEWAY_CA_B64 }}
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
        run: |
          set -euo pipefail
          if [ -z "${EPAPO_GATEWAY_CA_B64:-}" ]; then
            echo "==> EPAPO_GATEWAY_CA_B64 não configurado: imagem sem CA do gateway (chamadas desligadas ou em http privado)"
            exit 0
          fi
          IMG="${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${IMAGE_NAME}:${IMAGE_TAG}"
          # `$JAVA_HOME` é resolvido DENTRO da imagem: no runner ele não existe.
          if docker run --rm --entrypoint sh "${IMG}" -c \
               'keytool -list -alias epapo-gateway -keystore "$JAVA_HOME/lib/security/cacerts" -storepass changeit' \
               >/dev/null 2>&1; then
            echo "==> CA do gateway presente no cacerts da imagem"
          else
            echo "::error::EPAPO_GATEWAY_CA_B64 está configurado, mas o CA não está no cacerts da imagem."
            echo "A chamada ao gateway vai falhar com erro de certificado. Confira o ARG do Dockerfile e o build-args do passo de build."
            exit 1
          fi

      - name: 📤 Push para Harbor (docker push classico, tag por tag)
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
        run: |
          set -euo pipefail
          IMG="${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${IMAGE_NAME}"
          # Toda build publica a tag do commit. Produção publica também a flutuante `main`, que é
          # a única flutuante mantida: serve para apontar sempre para o último build de prod. A
          # QA não tem flutuante — quem sobe lá é a tag do commit, e a flutuante antiga só ficava
          # parada ocupando a cota.
          docker push "${IMG}:${IMAGE_TAG}"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            docker tag "${IMG}:${IMAGE_TAG}" "${IMG}:main"
            docker push "${IMG}:main"
          fi

  # ===========================================================================
  # Deploy QA — SOMENTE branch qa, SOMENTE push/workflow_dispatch, self-hosted
  # ===========================================================================
  deploy-qa:
    name: 🚢 Deploy → QA (docker-prod4)
    needs: build-and-push
    if: >
      needs.build-and-push.outputs.branch == 'qa' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, enois, docker-prod4]
    # Dois pushes em sequência não podem trocar o container um por cima do outro.
    concurrency:
      group: deploy-qa
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - name: 🚢 Recriar container via Portainer API
        env:
          PORTAINER_BASE_URL: ${{ secrets.PORTAINER_BASE_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          IMAGE_REF: ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }}
          HARBOR_USER: ${{ secrets.HARBOR_USER }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          DB_PASSWORD: ${{ secrets.QA_DB_PASSWORD }}
          REDE_SECURITY_ENCRYPTION_KEY: ${{ secrets.QA_REDE_SECURITY_ENCRYPTION_KEY }}
          TURNSTILE_SITE_KEY: ${{ secrets.QA_TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.QA_TURNSTILE_SECRET_KEY }}
          # Login social nos DOIS ambientes: a QA roda em `enois-qa.b7cloud.tech` com a API em
          # `enois-api-qa.b7cloud.tech/api`, entao precisa das mesmas credenciais do app, com o
          # redirect apontando para o FRONT da QA (e esse par que esta no allowlist do LinkedIn).
          # Sem o client-secret aqui a troca do `code` falha e o login nao completa.
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_REDIRECT_URI: ${{ vars.LINKEDIN_REDIRECT_URI_QA }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          # GitHub e usado apenas para VINCULAR a conta aos selos de contribuicao. A QA tem
          # credenciais proprias (prefixo QA_): assim o OAuth App de teste nao vaza para o
          # deploy de producao, que usa os nomes sem prefixo. Sem eles o vínculo responde
          # OAUTH_NOT_CONFIGURED e o sync usa a API publica (limite baixo).
          GITHUB_CLIENT_ID: ${{ secrets.QA_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.QA_GITHUB_CLIENT_SECRET }}
          GITHUB_CONTRIBUTIONS_TOKEN: ${{ secrets.QA_GITHUB_CONTRIBUTIONS_TOKEN }}
          # Sugestoes da comunidade: issue PUBLICA aberta so apos aprovacao de moderador. A QA tem
          # token e repositorios PROPRIOS (prefixo QA_): os repositorios devem ser um sandbox, nunca
          # os oficiais, para um teste na QA nao publicar issue de verdade. Sem eles a aprovacao
          # na QA responde 503 e nada sai. O token e so das sugestoes (Issues: write nos repos de
          # destino), separado do token do suporte.
          SUGGESTIONS_GITHUB_TOKEN: ${{ secrets.QA_SUGGESTIONS_GITHUB_TOKEN }}
          GITHUB_SUGGESTIONS_REPO_BACKEND: ${{ vars.QA_SUGGESTIONS_REPO_BACKEND }}
          GITHUB_SUGGESTIONS_REPO_FRONTEND: ${{ vars.QA_SUGGESTIONS_REPO_FRONTEND }}
          GITHUB_SUGGESTIONS_REPO_DESIGN_SYSTEM: ${{ vars.QA_SUGGESTIONS_REPO_DESIGN_SYSTEM }}
          # Issue so conta para o selo com a label de triagem `seal:qualified`, que nenhum template
          # de issue aplica (o template de bug aplica `bug` sozinho, entao `bug` nao serve). Sem a
          # label, a issue espera revisao no painel. O worker roda a cada 10 minutos para os selos
          # acompanharem o GitHub sozinhos.
          GITHUB_QUALIFIED_ISSUE_LABELS: "seal:qualified"
          GITHUB_SYNC_CRON: "0 */10 * * * *"
          # panic:yes => somente leitura; vazio/ausente => online (o botão do painel decide).
          # ImageKit aposentado, mas o purge/delete de midia antiga precisa funcionar ate a migracao.
          IMAGEKIT_URL_ENDPOINT: ${{ secrets.IMAGEKIT_URL_ENDPOINT }}
          IMAGEKIT_PUBLIC_KEY: ${{ secrets.IMAGEKIT_PUBLIC_KEY }}
          IMAGEKIT_PRIVATE_KEY: ${{ secrets.IMAGEKIT_PRIVATE_KEY }}
          # Busca de GIF no seletor e triagem por LLM (denuncias/quarentena): sem chave o backend
          # responde "sem provedor configurado" e a IA fica indisponível — a chave existe como
          # secret, mas não era injetada no container.
          REDE_GIFS_GIPHY_KEY: ${{ secrets.REDE_GIFS_GIPHY_KEY }}
          MODERATION_LLM_API_KEY: ${{ secrets.MODERATION_LLM_API_KEY }}
          PANIC_MODE: ${{ secrets.PANIC_MODE }}
          # Storage da midia na QA. Sem estas variaveis o app sobe em `imagekit` (o default) e o
          # S3StorageConfig nem e criado — o endpoint de upload responde 503 "desativado" mesmo
          # com o bucket funcionando em producao. A QA usa o MESMO bucket, separada pelo prefixo
          # `qa/`: objeto de teste nao se mistura com o de producao e a limpeza de um ambiente
          # nao alcanca o outro.
          REDE_MEDIA_STORAGE: ${{ secrets.PROD_REDE_MEDIA_STORAGE }}
          REDE_MEDIA_S3_BUCKET: ${{ secrets.PROD_REDE_MEDIA_S3_BUCKET }}
          REDE_MEDIA_S3_REGION: ${{ secrets.PROD_REDE_MEDIA_S3_REGION }}
          REDE_MEDIA_S3_ENDPOINT: ${{ secrets.PROD_REDE_MEDIA_S3_ENDPOINT }}
          REDE_MEDIA_S3_FORCE_PATH_STYLE: ${{ secrets.PROD_REDE_MEDIA_S3_FORCE_PATH_STYLE }}
          # Base publica = por onde o navegador LE e SOBE a midia. Como o PUT passa pelo app,
          # e ela que define QUAL API autentica a subida: com a base de producao, o upload da
          # QA ia para a API de producao (a sessao da QA nao vale la) e o arquivo nunca era
          # gravado. Cada ambiente aponta para a propria API; o bucket e o mesmo, separado
          # pelo prefixo `qa/`.
          REDE_MEDIA_S3_PUBLIC_BASE_URL: https://enois-api-qa.b7cloud.tech/api/storage/
          REDE_MEDIA_S3_PREFIX: qa/
          AWS_ACCESS_KEY_ID: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
          # Web Push (VAPID), par da QA — independente do de produção. A chave pública é a
          # identidade do servidor para o serviço de push do navegador: toda inscrição existente
          # foi criada com ela, então o valor vem de secret e é fixo entre deploys (nunca gerado
          # no boot). Sem as duas, o backend sobe com o push desligado e GET /push/config responde
          # enabled:false — as notificações continuam só dentro do app.
          VAPID_PUBLIC_KEY: ${{ secrets.QA_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.QA_VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: "mailto:suporte@enois.ia.br"
          # Epapo (videoconferência própria). Sem estas quatro variáveis o backend responde
          # 503 CALLS_NOT_CONFIGURED / MENTORING_ROOMS_NOT_CONFIGURED e nenhuma sala abre —
          # é o estado em que a QA estava, com a rota do gateway respondendo
          # GATEWAY_NOT_CONFIGURED. Os dois segredos são os MESMOS que a stack do Epapo usa,
          # pareados por nome: REDE_CALLS_EPAPO_INTERNAL_TOKEN = EPAPO_INTERNAL_TOKEN e
          # REDE_CALLS_GATEWAY_AUTHORIZE_TOKEN = ENOIS_AUTHORIZE_SECRET. Trocar um lado sem o
          # outro faz o gateway recusar (401) em vez de abrir.
          #
          # A URL é a origem pública do Epapo, com https e sem barra no fim. O gateway-url é
          # o endereço que ESTE backend alcança; hoje é o mesmo host público, porque o
          # auth-gateway só aceita o IP do backend no ufw.
          REDE_CALLS_EPAPO_URL: ${{ vars.REDE_CALLS_EPAPO_URL }}
          REDE_CALLS_EPAPO_GATEWAY_URL: ${{ vars.REDE_CALLS_EPAPO_GATEWAY_URL }}
          REDE_CALLS_EPAPO_INTERNAL_TOKEN: ${{ secrets.REDE_CALLS_EPAPO_INTERNAL_TOKEN }}
          REDE_CALLS_GATEWAY_AUTHORIZE_TOKEN: ${{ secrets.REDE_CALLS_GATEWAY_AUTHORIZE_TOKEN }}
        run: |
          set -euo pipefail
          API="${PORTAINER_BASE_URL}/api/endpoints/${PORTAINER_ENDPOINT_ID}/docker"
          AUTH=(-H "X-API-Key: ${PORTAINER_API_KEY}" -H "Referer: ${PORTAINER_BASE_URL}")
          NEW_NAME="${CONTAINER_NAME}-new"
          PREV_NAME="${CONTAINER_NAME}-previous"
          IMG_PATH="${IMAGE_REF%:*}"
          IMG_TAG="${IMAGE_REF##*:}"

          # Epapo: as quatro variáveis andam juntas. Todas vazias = chamadas desligadas, que é
          # um estado válido e documentado (o backend responde 503 explícito). Algumas vazias e
          # outras não = configuração pela metade, e aí o container sobe com a chamada "ligada"
          # falhando em toda tentativa de entrar numa sala. Falhar aqui é mais barato que
          # descobrir isso pela tela.
          epapo_set=0
          epapo_missing=""
          for name in REDE_CALLS_EPAPO_URL REDE_CALLS_EPAPO_GATEWAY_URL \
                      REDE_CALLS_EPAPO_INTERNAL_TOKEN REDE_CALLS_GATEWAY_AUTHORIZE_TOKEN; do
            if [ -n "${!name:-}" ]; then
              epapo_set=$((epapo_set + 1))
            else
              epapo_missing="${epapo_missing} ${name}"
            fi
          done
          if [ "${epapo_set}" -ne 0 ] && [ "${epapo_set}" -ne 4 ]; then
            echo "::error::configuração do Epapo pela metade — faltam:${epapo_missing}"
            echo "Defina as quatro (variáveis de repositório para as URLs, secrets para os tokens) ou nenhuma."
            exit 1
          fi
          if [ "${epapo_set}" -eq 0 ]; then
            echo "==> Epapo não configurado: chamadas e salas de mentoria ficam desligadas (503 explícito)"
          else
            # O gateway recebe dois segredos de servidor (o token interno e, na volta, o JWT
            # pronto para entrar na sala). O Epapo roda num provedor diferente deste backend,
            # sem rede privada entre os dois: por isso o salto tem de ser cifrado. http só é
            # aceito para loopback e faixas privadas — ali o tráfego não sai do host.
            epapo_gw_host=$(printf '%s' "${REDE_CALLS_EPAPO_GATEWAY_URL}" \
              | sed -E 's#^[a-z]+://##; s#[:/].*$##')
            case "${REDE_CALLS_EPAPO_GATEWAY_URL}" in
              https://*) ;;
              http://localhost*|http://127.*|http://10.*|http://192.168.*) ;;
              http://172.1[6-9].*|http://172.2[0-9].*|http://172.3[01].*) ;;
              *)
                echo "::error::REDE_CALLS_EPAPO_GATEWAY_URL não é https (host: ${epapo_gw_host})."
                echo "O gateway carrega segredo de servidor a cada chamada; em texto claro ele"
                echo "vaza para quem estiver no caminho. Publique-o com TLS e aponte o https para cá."
                exit 1
                ;;
            esac
            echo "==> Epapo configurado: ${REDE_CALLS_EPAPO_URL}"
          fi

          # Chamada ao proxy Docker do Portainer: imprime o corpo só quando dá certo e, quando
          # falha, mostra status + começo do corpo (sem despejar o progresso inteiro do pull).
          call() {
            local method="$1" path="$2" out status
            shift 2
            out="$(mktemp)"
            status="$(curl -sS -o "${out}" -w '%{http_code}' --connect-timeout 10 --max-time 60 \
              -X "${method}" "${AUTH[@]}" "$@" "${API}${path}")" || status="000"
            if [[ "${status}" != 2* ]]; then
              echo "!! ${method} ${path} -> HTTP ${status}" >&2
              head -c 600 "${out}" >&2 || true
              echo >&2
              rm -f "${out}"
              return 1
            fi
            cat "${out}"
            rm -f "${out}"
          }

          status_of() {
            local method="$1" path="$2"
            shift 2
            curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 60 \
              -X "${method}" "${AUTH[@]}" "$@" "${API}${path}" 2>/dev/null || echo 000
          }

          # 1) Espaço no Docker do host. Cada deploy baixa uma imagem nova de backend e a antiga
          #    fica para sempre; a poda do Harbor limpa o REGISTRO, não o disco desta máquina, e
          #    o runner não tem docker.sock — daí a limpeza passar pelo proxy do Portainer.
          if call GET /system/df > /tmp/enois-df.json 2>/dev/null; then
            python3 - <<'PY'
          import json
          d = json.load(open("/tmp/enois-df.json"))
          def mb(n): return f"{(n or 0) / 1048576:.0f} MB"
          imgs = sum((i.get("Size") or 0) - (i.get("SharedSize") or 0) for i in d.get("Images") or [])
          vols = sum(((v.get("UsageData") or {}).get("Size") or 0) for v in d.get("Volumes") or [])
          print(f"==> Docker do host: imagens ~{mb(imgs)} | volumes ~{mb(vols)}")
          PY
          else
            echo "::warning::não consegui ler o uso de disco do Docker (segue o deploy)"
          fi

          # Só builds de QA aposentados: `main` é o deploy de produção (e o Docker buscaria a
          # tag de novo no próximo deploy), e uma imagem em uso nunca deve ser apagada.
          echo "==> Removendo imagens aposentadas de ${IMAGE_NAME}:qa-* (a deste build fica)"
          if call GET /images/json > /tmp/enois-images.json 2>/dev/null; then
            python3 - "${IMAGE_REF}" "${IMG_PATH}:qa-" > /tmp/enois-old-tags.txt <<'PY'
          import json, sys
          current, prefix = sys.argv[1], sys.argv[2]
          for img in json.load(open("/tmp/enois-images.json")):
              if (img.get("Containers") or 0) > 0:
                  continue
              for tag in img.get("RepoTags") or []:
                  if tag.startswith(prefix) and tag != current:
                      print(tag)
          PY
            removed=0
            kept=0
            while IFS= read -r tag; do
              [[ -z "${tag}" ]] && continue
              if status_of DELETE "/images/${tag}?force=0&noprune=1" | grep -qE '^2'; then
                removed=$((removed + 1))
                echo "   removida: ${tag#*/}"
              else
                kept=$((kept + 1))
              fi
            done < /tmp/enois-old-tags.txt
            echo "==> ${removed} tag(s) removida(s), ${kept} ainda em uso"
          else
            echo "::warning::não consegui listar as imagens (segue o deploy)"
          fi

          # 2) Pull ANTES de mexer no que está no ar. O Docker devolve 200 mesmo quando a extração
          #    falha no meio do stream, então o erro é procurado no corpo — sem isso o passo
          #    seguia, parava e apagava o container bom para depois falhar no create.
          echo "==> Pull ${IMAGE_REF}"
          ENCODED_IMAGE=$(python3 -c "import urllib.parse,os;print(urllib.parse.quote(os.environ['IMAGE_REF'].rsplit(':',1)[0]))")
          # projeto 'enois' e privado no Harbor -> precisa de X-Registry-Auth no pull via Portainer
          REGISTRY_AUTH=$(python3 -c "import json,base64,os;print(base64.b64encode(json.dumps({'username':os.environ['HARBOR_USER'],'password':os.environ['HARBOR_PASSWORD'],'serveraddress':'${HARBOR_REGISTRY}'}).encode()).decode())")
          PULL_OUT=$(mktemp)
          PULL_STATUS=$(curl -sS -o "${PULL_OUT}" -w '%{http_code}' --connect-timeout 10 --max-time 600 \
            -X POST "${AUTH[@]}" -H "X-Registry-Auth: ${REGISTRY_AUTH}" \
            "${API}/images/create?fromImage=${ENCODED_IMAGE}&tag=${IMG_TAG}") || PULL_STATUS="000"
          if [[ "${PULL_STATUS}" != 2* ]] || grep -q '"error"' "${PULL_OUT}"; then
            echo "!! pull falhou (HTTP ${PULL_STATUS})"
            tail -c 800 "${PULL_OUT}" | tr -d '\r'
            echo
            echo "==> O container atual NÃO foi tocado."
            rm -f "${PULL_OUT}"
            exit 1
          fi
          tail -c 200 "${PULL_OUT}" | tr -d '\r'
          echo
          rm -f "${PULL_OUT}"

          # 3) Cria o novo SEM parar o atual: a porta só é disputada no start, então uma falha
          #    aqui deixa o container que está servindo intacto.
          echo "==> Criando ${NEW_NAME} (o atual segue no ar)"
          status_of DELETE "/containers/${NEW_NAME}?force=1" >/dev/null || true
          status_of DELETE "/containers/${PREV_NAME}?force=1" >/dev/null || true

          echo "==> Criar container novo"
          # Memoria do container da QA: host vmi935062 tem 7.76GB e e COMPARTILHADO com outros
          # tres projetos (apbackend_medcare, zmbackend e companhia) que rodam SEM limite de
          # memoria e ja usavam ~4.3GB juntos. Medido em 2026-10-24: o backend da QA usava
          # 0.55GB de 1GB. Subir para 2GB (reserva 1GB) e dar 60% do limite a JVM (heap ate
          # 1.2GB, em vez dos 256MB que 25% davam) cabe sem disputo com os vizinhos.
          # (O JSON abaixo NAO aceita comentario: ele vai cru no corpo do POST da Portainer.)
          # The payload carries every secret: private temp file, removed however the step ends
          # (self-hosted runners keep /tmp between jobs).
          DEPLOY_JSON=$(mktemp)
          trap 'rm -f "$DEPLOY_JSON"' EXIT
          cat > "$DEPLOY_JSON" <<EOF
          {
            "Image": "${IMAGE_REF}",
            "Env": [
              "SPRING_PROFILES_ACTIVE=qa",
              "DB_HOST=mariadb",
              "DB_PORT=3306",
              "DB_NAME=enois_qa",
              "DB_USER=enois_qa",
              "DB_PASSWORD=${DB_PASSWORD}",
              "REDE_FRONTEND_URL=https://enois-qa.b7cloud.tech",
              "REDE_BACKEND_URL=https://enois-api-qa.b7cloud.tech",
              "FRONTEND_URL=https://enois-qa.b7cloud.tech",
              "CORS_ALLOWED_ORIGINS=https://enois-qa.b7cloud.tech",
              "REDE_ORIGINS_ENFORCE=true",
              "PANIC_MODE=${PANIC_MODE}",
              "REDE_SECURITY_ENCRYPTION_KEY=${REDE_SECURITY_ENCRYPTION_KEY}",
              "TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY}",
              "TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}",
              "LINKEDIN_CLIENT_ID=${LINKEDIN_CLIENT_ID}",
              "LINKEDIN_CLIENT_SECRET=${LINKEDIN_CLIENT_SECRET}",
              "LINKEDIN_REDIRECT_URI=${LINKEDIN_REDIRECT_URI}",
              "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}",
              "GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}",
              "GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}",
              "GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}",
              "GITHUB_REDIRECT_URI=https://enois-api-qa.b7cloud.tech/api/auth/oauth/github/callback",
              "GITHUB_CONTRIBUTIONS_TOKEN=${GITHUB_CONTRIBUTIONS_TOKEN}",
              "SUGGESTIONS_GITHUB_TOKEN=${SUGGESTIONS_GITHUB_TOKEN}",
              "GITHUB_SUGGESTIONS_REPO_BACKEND=${GITHUB_SUGGESTIONS_REPO_BACKEND}",
              "GITHUB_SUGGESTIONS_REPO_FRONTEND=${GITHUB_SUGGESTIONS_REPO_FRONTEND}",
              "GITHUB_SUGGESTIONS_REPO_DESIGN_SYSTEM=${GITHUB_SUGGESTIONS_REPO_DESIGN_SYSTEM}",
              "GITHUB_QUALIFIED_ISSUE_LABELS=${GITHUB_QUALIFIED_ISSUE_LABELS}",
              "GITHUB_SYNC_ENABLED=true",
              "GITHUB_SYNC_CRON=${GITHUB_SYNC_CRON}",
              "IMAGEKIT_URL_ENDPOINT=${IMAGEKIT_URL_ENDPOINT}",
              "IMAGEKIT_PUBLIC_KEY=${IMAGEKIT_PUBLIC_KEY}",
              "IMAGEKIT_PRIVATE_KEY=${IMAGEKIT_PRIVATE_KEY}",
              "REDE_GIFS_GIPHY_KEY=${REDE_GIFS_GIPHY_KEY}",
              "MODERATION_LLM_API_KEY=${MODERATION_LLM_API_KEY}",
              "REDE_AUTH_SIGNUP_ENABLED=true",
              "SIGNUP_CAPTCHA_ENABLED=true",
              "REDE_MEDIA_STORAGE=${REDE_MEDIA_STORAGE}",
              "REDE_MEDIA_S3_BUCKET=${REDE_MEDIA_S3_BUCKET}",
              "REDE_MEDIA_S3_REGION=${REDE_MEDIA_S3_REGION}",
              "REDE_MEDIA_S3_ENDPOINT=${REDE_MEDIA_S3_ENDPOINT}",
              "REDE_MEDIA_S3_FORCE_PATH_STYLE=${REDE_MEDIA_S3_FORCE_PATH_STYLE}",
              "REDE_MEDIA_S3_PUBLIC_BASE_URL=${REDE_MEDIA_S3_PUBLIC_BASE_URL}",
              "REDE_MEDIA_S3_PREFIX=${REDE_MEDIA_S3_PREFIX}",
              "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}",
              "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}",
              "VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}",
              "VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}",
              "VAPID_SUBJECT=${VAPID_SUBJECT}",
              "REDE_CALLS_EPAPO_URL=${REDE_CALLS_EPAPO_URL}",
              "REDE_CALLS_EPAPO_GATEWAY_URL=${REDE_CALLS_EPAPO_GATEWAY_URL}",
              "REDE_CALLS_EPAPO_INTERNAL_TOKEN=${REDE_CALLS_EPAPO_INTERNAL_TOKEN}",
              "REDE_CALLS_GATEWAY_AUTHORIZE_TOKEN=${REDE_CALLS_GATEWAY_AUTHORIZE_TOKEN}",
              "TRUSTED_PROXY_IPS=154.12.230.97",
              "JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=60.0 -XX:+ExitOnOutOfMemoryError"
            ],
            "ExposedPorts": {"8081/tcp": {}},
            "HostConfig": {
              "RestartPolicy": {"Name": "unless-stopped"},
              "Memory": 2147483648,
              "MemorySwap": 2147483648,
              "MemoryReservation": 1073741824,
              "PortBindings": {"8081/tcp": [{"HostPort": "8105"}]},
              "NetworkMode": "enois-qa"
            },
            "NetworkingConfig": {
              "EndpointsConfig": {
                "enois-qa": {"Aliases": ["enois-backend", "enois-api"]}
              }
            }
          }
          EOF

          if ! call POST "/containers/create?name=${NEW_NAME}" \
              -H "Content-Type: application/json" -d @"$DEPLOY_JSON" > /tmp/enois-create.json; then
            echo "==> O container atual NÃO foi tocado."
            exit 1
          fi
          echo "   criado: $(python3 -c 'import json;print(json.load(open("/tmp/enois-create.json")).get("Id","?")[:12])')"

          # 4) Troca: para o atual, guarda como `-previous` e promove o novo. Qualquer falha
          #    devolve o anterior ao nome original e o sobe de novo.
          echo "==> Trocando para o novo"
          STOP_STATUS=$(status_of POST "/containers/${CONTAINER_NAME}/stop?t=20")
          case "${STOP_STATUS}" in
            204|304|404) ;;
            *)
              echo "!! não consegui parar ${CONTAINER_NAME} (HTTP ${STOP_STATUS}); nada foi trocado"
              status_of DELETE "/containers/${NEW_NAME}?force=1" >/dev/null || true
              exit 1
              ;;
          esac

          PREV_SAVED=0
          RENAME_STATUS=$(status_of POST "/containers/${CONTAINER_NAME}/rename?name=${PREV_NAME}")
          case "${RENAME_STATUS}" in
            204) PREV_SAVED=1 ;;
            404) echo "   (não havia container anterior)" ;;
            *)
              echo "!! não consegui renomear o container atual (HTTP ${RENAME_STATUS})"
              status_of POST "/containers/${CONTAINER_NAME}/start" >/dev/null || true
              status_of DELETE "/containers/${NEW_NAME}?force=1" >/dev/null || true
              exit 1
              ;;
          esac

          restaurar() {
            echo "==> Rollback: devolvendo ${PREV_NAME} para ${CONTAINER_NAME}"
            status_of DELETE "/containers/${CONTAINER_NAME}?force=1" >/dev/null || true
            status_of POST "/containers/${PREV_NAME}/rename?name=${CONTAINER_NAME}" >/dev/null || true
            status_of POST "/containers/${CONTAINER_NAME}/start" >/dev/null || true
          }

          if [[ "$(status_of POST "/containers/${NEW_NAME}/rename?name=${CONTAINER_NAME}")" != "204" ]]; then
            echo "!! não consegui promover o novo container"
            if [[ ${PREV_SAVED} -eq 1 ]]; then
              restaurar
            fi
            exit 1
          fi

          START_STATUS=$(status_of POST "/containers/${CONTAINER_NAME}/start")
          case "${START_STATUS}" in
            204|304) ;;
            *)
              echo "!! start do novo container falhou (HTTP ${START_STATUS})"
              if [[ ${PREV_SAVED} -eq 1 ]]; then
                restaurar
              fi
              exit 1
              ;;
          esac
          echo "==> Container novo no ar com ${IMAGE_REF}"
          if [[ ${PREV_SAVED} -eq 1 ]]; then
            echo "   anterior guardado como ${PREV_NAME} até o health check"
          fi

      - name: 🩺 Health check
        env:
          PORTAINER_BASE_URL: ${{ secrets.PORTAINER_BASE_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          REDE_CALLS_EPAPO_GATEWAY_URL: ${{ vars.REDE_CALLS_EPAPO_GATEWAY_URL }}
          REDE_CALLS_EPAPO_INTERNAL_TOKEN: ${{ secrets.REDE_CALLS_EPAPO_INTERNAL_TOKEN }}
          EPAPO_GATEWAY_CA_B64: ${{ secrets.EPAPO_GATEWAY_CA_B64 }}
        run: |
          # Boot do Spring (Flyway + Hibernate + Tomcat) na QA roda com lazy-initialization=false e
          # ainda carrega as vagas externas na subida: 75s era curto demais e um boot lento
          # aparecia como deploy quebrado. 30 tentativas de 10s = 5min.
          API="${PORTAINER_BASE_URL}/api/endpoints/${PORTAINER_ENDPOINT_ID}/docker"
          AUTH=(-H "X-API-Key: ${PORTAINER_API_KEY}" -H "Referer: ${PORTAINER_BASE_URL}")
          status_of() {
            local method="$1" path="$2"
            shift 2
            curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 60 \
              -X "${method}" "${AUTH[@]}" "$@" "${API}${path}" 2>/dev/null || echo 000
          }

          # O container subiu, mas isso não prova que ele alcança o Epapo: o gateway fica noutro
          # host e o ufw de lá só libera a porta para o IP de quem chama. Esta sonda roda no
          # mesmo host do container da QA (o runner é self-hosted na docker-prod4), então mede o
          # MESMO caminho de rede que o backend usa. Sem isso, "conectado" seria só configuração
          # desejada: o deploy passaria verde e a primeira entrada numa sala falharia.
          #
          # 200/403/404 do Énóis provam que o Epapo atendeu e repassou a pergunta; 401 prova que
          # ele atendeu e recusou a credencial de servidor — par de segredos trocado, não rede.
          # Só 000 (nada respondeu) é o firewall no caminho.
          probe_gateway() {
            if [ -z "${REDE_CALLS_EPAPO_GATEWAY_URL:-}" ]; then
              echo "Epapo não configurado: nada a sondar."
              return 0
            fi
            echo "=== alcance do gateway do Epapo a partir do host da QA ==="
            local probe ca_args=()
            # O certificado do gateway é emitido pela própria stack: o curl não o conhece e
            # recusaria o handshake, o que apareceria como "não respondeu" — o mesmo sintoma
            # do firewall, por um motivo diferente. O CA vem no build da imagem do backend,
            # então a sonda o usa aqui, medindo o caminho que o backend realmente percorre.
            if [ -n "${EPAPO_GATEWAY_CA_B64:-}" ]; then
              local ca_file
              ca_file="$(mktemp)"
              printf '%s' "${EPAPO_GATEWAY_CA_B64}" | base64 -d > "${ca_file}"
              ca_args=(--cacert "${ca_file}")
            fi
            # `|| true`: o curl já imprime 000 quando não conecta e sai com erro. Com `|| echo 000`
            # o valor virava 000000 e caía no ramo "resposta inesperada" em vez de "não respondeu".
            probe=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 10 \
              ${ca_args[@]+"${ca_args[@]}"} \
              -X POST "${REDE_CALLS_EPAPO_GATEWAY_URL%/}/auth/token" \
              -H "X-Epapo-Internal: ${REDE_CALLS_EPAPO_INTERNAL_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"callId":"00000000-0000-0000-0000-000000000000","userId":"00000000-0000-0000-0000-000000000000"}' \
              2>/dev/null || true)
            probe="${probe:-000}"
            case "${probe}" in
              200|401|403|404)
                echo " gateway respondeu (${probe}) em ${REDE_CALLS_EPAPO_GATEWAY_URL}"
                ;;
              000|"")
                echo "::warning::o Epapo não respondeu em ${REDE_CALLS_EPAPO_GATEWAY_URL} a partir do host da QA."
                echo "O backend está no ar, mas ninguém entra em sala até essa porta estar liberada para este IP."
                ;;
              *)
                echo "::warning::resposta inesperada do Epapo (${probe}) em ${REDE_CALLS_EPAPO_GATEWAY_URL}"
                ;;
            esac
          }

          URL=https://enois-api-qa.b7cloud.tech/health
          for i in $(seq 1 30); do
            if curl -sf --max-time 10 "$URL"; then
              echo "OK na tentativa $i"
              # Subiu: o container anterior guardado deixa de ser necessário.
              status_of DELETE "/containers/${CONTAINER_NAME}-previous?force=1" >/dev/null || true
              probe_gateway
              exit 0
            fi
            echo "tentativa $i falhou, aguardando..."
            sleep 10
          done

          # Ate aqui o deploy falhava "mudo": o CI nao dizia POR QUE o container nao respondeu.
          # O proprio Portainer (endpoint 8 = docker-prod4) tem o estado e o log do container.
          echo "=== estado do ${CONTAINER_NAME} ==="
          curl -s --max-time 20 "${AUTH[@]}" "${API}/containers/${CONTAINER_NAME}/json" \
            | tr ',' '\n' | grep -E '"(Status|Running|ExitCode|RestartCount|OOMKilled|StartedAt|FinishedAt)"' | head -20
          echo "=== ultimas linhas do container ==="
          curl -s --max-time 30 "${AUTH[@]}" \
            "${API}/containers/${CONTAINER_NAME}/logs?tail=200&stdout=1&stderr=1" \
            | tr -cd '\11\12\15\40-\176' | tail -n 120

          # O novo não subiu: devolve o anterior ao nome original em vez de deixar a QA fora.
          if [[ "$(status_of GET "/containers/${CONTAINER_NAME}-previous/json")" == "200" ]]; then
            echo "=== rollback para o container anterior ==="
            status_of DELETE "/containers/${CONTAINER_NAME}?force=1" >/dev/null || true
            status_of POST "/containers/${CONTAINER_NAME}-previous/rename?name=${CONTAINER_NAME}" >/dev/null || true
            status_of POST "/containers/${CONTAINER_NAME}/start" >/dev/null || true
          fi
          echo "health check nao respondeu apos 300s"
          exit 1

  # ===========================================================================
  # Deploy PROD — SOMENTE branch main, SOMENTE push/workflow_dispatch, self-hosted
  # ===========================================================================
  deploy-prod:
    name: 🚢 Deploy → PROD (enois-node2)
    needs: build-and-push
    if: >
      needs.build-and-push.outputs.branch == 'main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, enois, docker-prod4]
    steps:
      # Deploy sempre via Portainer STACK (nunca container avulso via /containers/create).
      # Stack "enois-prod-backend" (id 350) no endpoint 11 (enois-node2), criada manualmente
      # como standalone compose string; aqui so atualizamos o StackFileContent com a nova tag
      # de imagem e os secrets, via PUT /stacks/{id}, que faz o Portainer recriar o container.
      - name: 🚢 Atualizar stack via Portainer API (endpoint enois-node2)
        env:
          PORTAINER_BASE_URL: ${{ secrets.PORTAINER_BASE_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          PORTAINER_ENDPOINT_ID_PROD: 11
          PROD_STACK_ID: 350
          IMAGE_REF: ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }}
          DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          # Senha da caixa noreply@enois.ia.br no mail.b7cloud.tech. Sem ela o servidor
          # responde "Authentication failed" e nenhum e-mail de 2FA/reset sai.
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          REDE_SECURITY_ENCRYPTION_KEY: ${{ secrets.PROD_REDE_SECURITY_ENCRYPTION_KEY }}
          TURNSTILE_SITE_KEY: ${{ secrets.PROD_TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.PROD_TURNSTILE_SECRET_KEY }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_REDIRECT_URI: ${{ secrets.LINKEDIN_REDIRECT_URI }}
          # GOOGLE_CLIENT_ID/GOOGLE_CLIENT_SECRET: nao existem como secret neste repo ainda
          # (checado 2026-10-23, so LINKEDIN_* existe). Sem valor real pra passar; login Google
          # continua desabilitado em prod até o dono criar o OAuth client e o secret no GitHub.
          # Storage S3 (object-storage b7cloud, gateway S3-compativel, nao AWS real). Ver PR #81
          # (S3StorageConfig) — sem REDE_MEDIA_S3_ENDPOINT/FORCE_PATH_STYLE o SDK tentaria AWS real.
          REDE_MEDIA_STORAGE: ${{ secrets.PROD_REDE_MEDIA_STORAGE }}
          REDE_MEDIA_S3_BUCKET: ${{ secrets.PROD_REDE_MEDIA_S3_BUCKET }}
          REDE_MEDIA_S3_REGION: ${{ secrets.PROD_REDE_MEDIA_S3_REGION }}
          REDE_MEDIA_S3_ENDPOINT: ${{ secrets.PROD_REDE_MEDIA_S3_ENDPOINT }}
          REDE_MEDIA_S3_FORCE_PATH_STYLE: ${{ secrets.PROD_REDE_MEDIA_S3_FORCE_PATH_STYLE }}
          REDE_MEDIA_S3_PUBLIC_BASE_URL: ${{ secrets.PROD_REDE_MEDIA_S3_PUBLIC_BASE_URL }}
          # Credencial lida pela cadeia padrao do AWS SDK (nao existe property Spring pra isso).
          AWS_ACCESS_KEY_ID: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          # Observabilidade (TASK-041). Nao sao segredo (so apontam pro Alloy local e ligam
          # endpoints do Actuator), por isso ficam em Actions Variables, nao Secrets.
          # MANAGEMENT_ENDPOINTS expoe prometheus/metrics ALEM de health — isso so e seguro porque
          # o Traefik em docker-prod3 tem um router dedicado bloqueando Host(api.enois.ia.br) &&
          # PathPrefix(/api/actuator) com ipAllowList (ver dynamic.yml do enois-traefik); sem esse
          # bloqueio, subir este valor aqui vazaria metricas internas da JVM publicamente.
          MANAGEMENT_ENDPOINTS: ${{ vars.MANAGEMENT_ENDPOINTS }}
          # IP do Traefik em docker-prod3, unico hop confiavel pra X-Forwarded-For em prod
          # (ver ClientIpResolver.isTrustedProxy). Sem isto o backend cai no fallback de
          # getRemoteAddr() e todo request vira o IP do proxy, nao o do cliente real.
          TRUSTED_PROXY_IPS: ${{ vars.TRUSTED_PROXY_IPS }}
          # Alloy (stack enois-observability, Portainer id 353) escuta OTLP em 127.0.0.1:4318;
          # o backend roda host-network no mesmo node2, entao "localhost" aqui e o host real.
          MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: ${{ vars.MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT }}
          # 0.2 = 20% das requests tracadas em prod. O default do app (1.0) e dev-grade; 1.0 em
          # prod gravaria span de TODA request no Tempo sem necessidade. Ajustar depois com dado
          # real de volume se 20% gerar ruido/custo de storage demais ou pouca amostra.
          TRACING_SAMPLING_PROBABILITY: ${{ vars.TRACING_SAMPLING_PROBABILITY }}
          # O GitHub recusa secrets cujo NOME comeca com GITHUB_ (HTTP 422), por isso o nome do
          # secret e OAUTH_GITHUB_*; a variavel de ambiente que o app le continua GITHUB_*.
          GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          GITHUB_CONTRIBUTIONS_TOKEN: ${{ secrets.OAUTH_GITHUB_CONTRIBUTIONS_TOKEN }}
          # Sugestoes da comunidade (issue publica apos aprovacao). Token proprio, separado do
          # token do suporte (que enxerga o repositorio privado): fine-grained, Issues: write so nos
          # repositorios publicos de destino abaixo.
          SUGGESTIONS_GITHUB_TOKEN: ${{ secrets.SUGGESTIONS_GITHUB_TOKEN }}
          GITHUB_SUGGESTIONS_REPO_BACKEND: ${{ vars.SUGGESTIONS_REPO_BACKEND }}
          GITHUB_SUGGESTIONS_REPO_FRONTEND: ${{ vars.SUGGESTIONS_REPO_FRONTEND }}
          GITHUB_SUGGESTIONS_REPO_DESIGN_SYSTEM: ${{ vars.SUGGESTIONS_REPO_DESIGN_SYSTEM }}
          # Issue so conta para o selo com a label de triagem `seal:qualified` (nenhum template de
          # issue a aplica), como na QA.
          GITHUB_QUALIFIED_ISSUE_LABELS: "seal:qualified"
          # ImageKit aposentado (storage no S3), mas o purge/delete de midia antiga ainda
          # conversa com ele ate a migracao de objetos terminar.
          IMAGEKIT_URL_ENDPOINT: ${{ secrets.IMAGEKIT_URL_ENDPOINT }}
          IMAGEKIT_PUBLIC_KEY: ${{ secrets.IMAGEKIT_PUBLIC_KEY }}
          IMAGEKIT_PRIVATE_KEY: ${{ secrets.IMAGEKIT_PRIVATE_KEY }}
          # Busca de GIF no seletor e triagem por LLM (denuncias/quarentena): sem chave o backend
          # responde "sem provedor configurado" e a IA fica indisponível — a chave existe como
          # secret, mas não era injetada no container.
          REDE_GIFS_GIPHY_KEY: ${{ secrets.REDE_GIFS_GIPHY_KEY }}
          MODERATION_LLM_API_KEY: ${{ secrets.MODERATION_LLM_API_KEY }}
          # Web Push (VAPID), par de PRODUÇÃO — distinto do da QA, para que um teste na QA nunca
          # valha como inscrição de produção. Fixo entre deploys: a chave pública assina as
          # inscrições já existentes e trocá-la as invalida. Sem as duas, o push fica desligado
          # (GET /push/config → enabled:false) e as notificações seguem só dentro do app.
          VAPID_PUBLIC_KEY: ${{ secrets.PROD_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.PROD_VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: "mailto:suporte@enois.ia.br"
          # Observability channel (Telegram via the Kof Agent bot). Production only: QA has no token,
          # so the channel stays inert there. docs/KOF_AGENT.md
          KOF_AGENT_API_TOKEN: ${{ secrets.KOF_AGENT_API_TOKEN }}
          KOF_AGENT_CHAT_ID: ${{ secrets.KOF_AGENT_CHAT_ID }}
        run: |
          set -euo pipefail
          AUTH=(-H "X-API-Key: ${PORTAINER_API_KEY}" -H "Referer: ${PORTAINER_BASE_URL}")

          echo "==> Gerar docker-compose da stack com a imagem/secrets atuais"
          # Stack file and payload carry every secret: private temp files, removed however the step ends.
          STACK_YML=$(mktemp)
          STACK_PAYLOAD=$(mktemp)
          trap 'rm -f "$STACK_YML" "$STACK_PAYLOAD"' EXIT
          cat > "$STACK_YML" <<EOF
          version: "3.8"
          services:
            backend:
              image: ${IMAGE_REF}
              container_name: enois-prod-backend
              network_mode: host
              restart: unless-stopped
              # enois-node2 (6 vCPU/11.68GB) e dedicado so a este projeto (so compartilha host
              # com o MariaDB bare-metal). Limite anterior era 0 (sem cap, risco de a JVM
              # engolir toda a RAM e sufocar o MariaDB). mem_limit/mem_reservation/memswap_limit
              # (nao deploy.resources, que e ignorado fora de swarm) sao honrados pelo Docker
              # Compose standalone.
              #
              # Medido no host em 2026-10-24: o container usava 0.79GB de 4GB e a JVM, sem flag,
              # so podia usar 25% do limite (MaxRAMPercentage) = 1GB de heap — a RAM estava
              # ociosa. Agora 6g/3g com MaxRAMPercentage=60: heap ate 3.6GB, e ainda sobra
              # ~5GB pro MariaDB+SO (o banco e bare-metal e nao aparece no inventario).
              mem_limit: 6g
              mem_reservation: 3g
              memswap_limit: 6g
              environment:
                # Sem isto a JVM usa 25% do limite como heap (1GB de 4GB) e o resto da RAM fica
                # sem uso; 60% + ExitOnOutOfMemoryError deixa a JVM crescer sob demanda e morre
                # com erro claro (em vez de ser morta pelo kernel sem log).
                JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -XX:+ExitOnOutOfMemoryError"
                SPRING_PROFILES_ACTIVE: prd
                DB_PASSWORD: ${DB_PASSWORD}
                REDE_FRONTEND_URL: https://enois.ia.br
                REDE_BACKEND_URL: https://api.enois.ia.br
                FRONTEND_URL: https://enois.ia.br
                CORS_ALLOWED_ORIGINS: https://enois.ia.br
                REDE_SECURITY_ENCRYPTION_KEY: ${REDE_SECURITY_ENCRYPTION_KEY}
                TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY}
                TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
                REDE_AUTH_SIGNUP_ENABLED: "true"
                SIGNUP_CAPTCHA_ENABLED: "true"
                # SMTP do dominio (mail.b7cloud.tech) na 465, que e a porta de saida liberada para
                # este host — a 587 abre daqui, mas o egresso do cluster nao chega nela (connect
                # timeout). A 465 e TLS implicito (SMTPS): a conexao ja nasce cifrada e o servidor
                # NAO anuncia STARTTLS, entao ele fica desligado (com starttls.required o envio
                # falha com "host does not support STARTTLS"). Sem estas variaveis o Spring cai em
                # localhost:587 e NENHUM e-mail sai (2FA, reset, confirmacao).
                SPRING_MAIL_HOST: mail.b7cloud.tech
                SPRING_MAIL_PORT: "465"
                SPRING_MAIL_USERNAME: suporte@enois.ia.br
                SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
                SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE: "true"
                SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"
                SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: "false"
                LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID}
                LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET}
                LINKEDIN_REDIRECT_URI: ${LINKEDIN_REDIRECT_URI}
                REDE_MEDIA_STORAGE: ${REDE_MEDIA_STORAGE}
                REDE_MEDIA_S3_BUCKET: ${REDE_MEDIA_S3_BUCKET}
                REDE_MEDIA_S3_REGION: ${REDE_MEDIA_S3_REGION}
                REDE_MEDIA_S3_ENDPOINT: ${REDE_MEDIA_S3_ENDPOINT}
                REDE_MEDIA_S3_FORCE_PATH_STYLE: ${REDE_MEDIA_S3_FORCE_PATH_STYLE}
                REDE_MEDIA_S3_PUBLIC_BASE_URL: ${REDE_MEDIA_S3_PUBLIC_BASE_URL}
                AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
                AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
                GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
                GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
                GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID}"
                GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET}"
                GITHUB_REDIRECT_URI: "https://api.enois.ia.br/api/auth/oauth/github/callback"
                GITHUB_CONTRIBUTIONS_TOKEN: "${GITHUB_CONTRIBUTIONS_TOKEN}"
                SUGGESTIONS_GITHUB_TOKEN: "${SUGGESTIONS_GITHUB_TOKEN}"
                GITHUB_SUGGESTIONS_REPO_BACKEND: "${GITHUB_SUGGESTIONS_REPO_BACKEND}"
                GITHUB_SUGGESTIONS_REPO_FRONTEND: "${GITHUB_SUGGESTIONS_REPO_FRONTEND}"
                GITHUB_SUGGESTIONS_REPO_DESIGN_SYSTEM: "${GITHUB_SUGGESTIONS_REPO_DESIGN_SYSTEM}"
                GITHUB_QUALIFIED_ISSUE_LABELS: "${GITHUB_QUALIFIED_ISSUE_LABELS}"
                GITHUB_SYNC_ENABLED: "true"
                GITHUB_SYNC_CRON: "0 */10 * * * *"
                MANAGEMENT_ENDPOINTS: ${MANAGEMENT_ENDPOINTS}
                TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS}
                MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: ${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT}
                TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY}
                IMAGEKIT_URL_ENDPOINT: "${IMAGEKIT_URL_ENDPOINT}"
                IMAGEKIT_PUBLIC_KEY: "${IMAGEKIT_PUBLIC_KEY}"
                IMAGEKIT_PRIVATE_KEY: "${IMAGEKIT_PRIVATE_KEY}"
                REDE_GIFS_GIPHY_KEY: "${REDE_GIFS_GIPHY_KEY}"
                MODERATION_LLM_API_KEY: "${MODERATION_LLM_API_KEY}"
                VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY}"
                VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY}"
                VAPID_SUBJECT: "${VAPID_SUBJECT}"
                KOF_AGENT_API_TOKEN: "${KOF_AGENT_API_TOKEN}"
                KOF_AGENT_CHAT_ID: "${KOF_AGENT_CHAT_ID}"
          EOF

          echo "==> Montar payload JSON (python escapa o YAML certo pro body)"
          python3 -c "
          import json, sys
          with open(sys.argv[1]) as f:
              content = f.read()
          payload = {'stackFileContent': content, 'env': [], 'prune': True, 'pullImage': True}
          with open(sys.argv[2], 'w') as f:
              json.dump(payload, f)
          " "$STACK_YML" "$STACK_PAYLOAD"

          echo "==> PUT /stacks/${PROD_STACK_ID} (endpointId=${PORTAINER_ENDPOINT_ID_PROD})"
          curl -sf -X PUT "${AUTH[@]}" -H "Content-Type: application/json" \
            "${PORTAINER_BASE_URL}/api/stacks/${PROD_STACK_ID}?endpointId=${PORTAINER_ENDPOINT_ID_PROD}" \
            -d @"$STACK_PAYLOAD"

      - name: 🩺 Health check
        run: |
          for i in $(seq 1 15); do
            if curl -sf --max-time 10 https://api.enois.ia.br/health; then
              echo "OK na tentativa $i"
              exit 0
            fi
            echo "tentativa $i falhou, aguardando..."
            sleep 5
          done
          echo "health check nao respondeu apos 75s"
          exit 1
