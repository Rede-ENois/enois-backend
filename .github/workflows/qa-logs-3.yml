name: QA Logs 3

on:
  push:
    branches: [chore/chamadas-diagnostico]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gw:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Callback do gateway com o segredo real (so tempo e status)
        env:
          PORTAINER_BASE_URL: ${{ secrets.PORTAINER_BASE_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
        run: |
          set +e
          AUTH=(-H "X-API-Key: ${PORTAINER_API_KEY}" -H "Referer: ${PORTAINER_BASE_URL}")
          API="${PORTAINER_BASE_URL}/api/endpoints/12/docker"

          run_in() {
            local id
            id=$(curl -sS --max-time 30 "${AUTH[@]}" -H "Content-Type: application/json" \
              -X POST "${API}/containers/epapo-prod-auth-gateway-1/exec" \
              -d "$(python3 -c "import json,sys;print(json.dumps({'AttachStdout':True,'AttachStderr':True,'Cmd':['sh','-c',sys.argv[1]]}))" "$1")" \
              | python3 -c "import sys,json;print(json.load(sys.stdin).get('Id',''))")
            curl -sS --max-time 200 "${AUTH[@]}" -H "Content-Type: application/json" \
              -X POST "${API}/exec/${id}/start" -d '{"Detach":false,"Tty":false}' -o /tmp/ex.out
            tr -d "\000" < /tmp/ex.out | head -c 2000
            echo
          }

          echo "=== callback com o segredo real, 3x (id inexistente) ==="
          run_in 'for i in 1 2 3; do S=$(date +%s%N); C=$(curl -sS -o /tmp/c -w "%{http_code}" --connect-timeout 5 --max-time 40 -X POST "$ENOIS_BACKEND_URL/calls/00000000-0000-0000-0000-000000000000/gateway/entry/00000000-0000-0000-0000-000000000000" -H "X-Enois-Authorize: $ENOIS_AUTHORIZE_SECRET" -H "Content-Length: 0"); E=$(date +%s%N); echo "code=$C ms=$(( (E-S)/1000000 )) body=$(head -c 100 /tmp/c)"; done'

          echo "=== o mesmo pela URL publica (Cloudflare) ==="
          run_in 'for i in 1 2; do S=$(date +%s%N); C=$(curl -sS -o /tmp/c -w "%{http_code}" --connect-timeout 5 --max-time 40 -X POST "https://api.enois.ia.br/api/calls/00000000-0000-0000-0000-000000000000/gateway/entry/00000000-0000-0000-0000-000000000000" -H "X-Enois-Authorize: $ENOIS_AUTHORIZE_SECRET" -H "Content-Length: 0"); E=$(date +%s%N); echo "code=$C ms=$(( (E-S)/1000000 )) body=$(head -c 100 /tmp/c)"; done'

          echo "=== DNS/rota do container do gateway ==="
          run_in 'getent ahostsv4 api.enois.ia.br | head -2; echo ---; getent ahostsv4 enois-api-qa.b7cloud.tech | head -2'
