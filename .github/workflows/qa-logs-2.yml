name: QA Logs 2

on:
  push:
    branches: [chore/chamadas-diagnostico]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: [self-hosted, enois, docker-prod4]
    timeout-minutes: 15
    steps:
      - name: Emissao real a partir do host da QA
        env:
          PORTAINER_BASE_URL: ${{ secrets.PORTAINER_BASE_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
        run: |
          set +e
          AUTH=(-H "X-API-Key: ${PORTAINER_API_KEY}" -H "Referer: ${PORTAINER_BASE_URL}")
          API="${PORTAINER_BASE_URL}/api/endpoints/8/docker"

          run_in() {
            local id
            id=$(curl -sS --max-time 30 "${AUTH[@]}" -H "Content-Type: application/json" \
              -X POST "${API}/containers/enois-qa-backend/exec" \
              -d "$(python3 -c "import json,sys;print(json.dumps({'AttachStdout':True,'AttachStderr':True,'Cmd':['sh','-c',sys.argv[1]]}))" "$1")" \
              | python3 -c "import sys,json;print(json.load(sys.stdin).get('Id',''))")
            curl -sS --max-time 120 "${AUTH[@]}" -H "Content-Type: application/json" \
              -X POST "${API}/exec/${id}/start" -d '{"Detach":false,"Tty":false}' -o /tmp/ex.out
            tr -d "\000" < /tmp/ex.out | head -c 1500
            echo
          }

          echo "=== ferramentas na QA ==="
          run_in 'for b in bash curl wget nc openssl java keytool; do command -v $b >/dev/null && echo "tem $b"; done'

          echo "=== handshake e emissao a partir do container da QA ==="
          run_in 'echo "gw=$(echo $REDE_CALLS_EPAPO_GATEWAY_URL | sed -E "s#(https?://[^/]+).*#\1#")"; for i in 1 2 3; do S=$(date +%s%N); curl -sS -o /tmp/o -w "code=%{http_code} connect=%{time_connect} verify=%{time_appconnect} total=%{time_total}" --connect-timeout 5 --max-time 30 -X POST "$REDE_CALLS_EPAPO_GATEWAY_URL/auth/token" -H "X-Epapo-Internal: $REDE_CALLS_EPAPO_INTERNAL_TOKEN" -H "Content-Type: application/json" --data "{\"callId\":\"00000000-0000-0000-0000-000000000000\",\"userId\":\"00000000-0000-0000-0000-000000000000\"}"; echo " body=$(head -c 120 /tmp/o)"; done'
