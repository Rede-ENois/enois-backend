name: QA Logs

on:
  push:
    branches: [chore/chamadas-diagnostico]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gw:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Metodos por rota de chamada
        env:
          PORTAINER_BASE_URL: ${{ secrets.PORTAINER_BASE_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
        run: |
          set +e
          dump() {
            curl -sS --max-time 180 \
              -H "X-API-Key: ${PORTAINER_API_KEY}" -H "Referer: ${PORTAINER_BASE_URL}" \
              "${PORTAINER_BASE_URL}/api/endpoints/$1/docker/containers/$2/logs?stdout=1&stderr=1&timestamps=1&tail=200000" \
              -o /tmp/b.log
            tr -d "\000" < /tmp/b.log
          }
          for env in "8 enois-qa-backend QA" "11 enois-prod-backend PROD"; do
            set -- $env
            echo "===== $3 ====="
            dump $1 $2 > /tmp/c.log
            grep -a -oE '"method":"[A-Z]+","path":"/calls[^"]*"' /tmp/c.log | sort | uniq -c | sort -rn | head -20
            echo "-- join (qualquer metodo):"
            grep -a -oE '"method":"[A-Z]+","path":"/calls/[^"]*/join"' /tmp/c.log | sort | uniq -c
            echo "-- primeira e ultima linha:"
            head -c 300 /tmp/c.log | grep -aoE '"@timestamp":"[^"]*"' | head -1
            tail -c 2000 /tmp/c.log | grep -aoE '"@timestamp":"[^"]*"' | tail -1
          done
