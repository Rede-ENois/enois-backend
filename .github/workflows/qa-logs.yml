name: QA Logs

on:
  push:
    branches: [chore/chamadas-diagnostico]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gw:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Logs crus dos backends
        env:
          PORTAINER_BASE_URL: ${{ secrets.PORTAINER_BASE_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
        run: |
          set +e
          show() {
            curl -sS --max-time 90 \
              -H "X-API-Key: ${PORTAINER_API_KEY}" -H "Referer: ${PORTAINER_BASE_URL}" \
              "${PORTAINER_BASE_URL}/api/endpoints/$1/docker/containers/$2/logs?stdout=1&stderr=1&timestamps=1&tail=$3" \
              -o /tmp/b.log
            echo "bytes=$(wc -c < /tmp/b.log)"
            tr -d "\000" < /tmp/b.log | tail -25
          }
          echo "=== QA raw ==="
          show 8 enois-qa-backend 300
          echo "=== PROD raw ==="
          show 11 enois-prod-backend 300
