name: QA Logs

on:
  push:
    branches: [chore/chamadas-diagnostico]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Diagnóstico das chamadas
        env:
          PORTAINER_BASE_URL: ${{ secrets.PORTAINER_BASE_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
        run: |
          set -uo pipefail
          AUTH=(-H "X-API-Key: ${PORTAINER_API_KEY}" -H "Referer: ${PORTAINER_BASE_URL}")

          list_containers() {
            curl -sS --max-time 60 "${AUTH[@]}" \
              "${PORTAINER_BASE_URL}/api/endpoints/$1/docker/containers/json?all=1" \
              | python3 -c "
          import sys, json
          try:
              data = json.load(sys.stdin)
          except Exception as e:
              print('(falhou)', e); raise SystemExit
          for c in data:
              print((c.get('Names') or [''])[0].lstrip('/'), c.get('State'))
          "
          }

          echo "=== endpoint 8 (QA) containers ==="
          list_containers 8
          echo "=== endpoint 11 (prod) containers ==="
          list_containers 11
          echo "=== endpoint 12 (node3/gateway) containers ==="
          list_containers 12

          fetch_logs() {
            EP="$1"; NAME="$2"; OUT="$3"
            code=$(curl -sS --max-time 90 -o "${OUT}" -w '%{http_code}' "${AUTH[@]}" \
              "${PORTAINER_BASE_URL}/api/endpoints/${EP}/docker/containers/${NAME}/logs?stdout=1&stderr=1&timestamps=1&tail=3000")
            echo "http=${code} bytes=$(wc -c < "${OUT}") ${NAME} (ep ${EP})"
          }

          echo "=== logs do gateway (node3) ==="
          for NAME in $(list_containers 12 | grep -i "gateway" | cut -d' ' -f1); do
            fetch_logs 12 "${NAME}" /tmp/gw.log
            tr -d "\000" < /tmp/gw.log | tail -25 | cut -c1-300
          done

          echo "=== logs do backend QA ==="
          for NAME in $(list_containers 8 | grep -i backend | cut -d' ' -f1); do
            fetch_logs 8 "${NAME}" /tmp/qa.log
            tr -d "\000" < /tmp/qa.log | grep -a "EpapoMeetingTokenIssuer\|CALLS_UNAVAILABLE\|api_error" | tail -8 | cut -c1-300
          done

          echo "=== logs do backend prod ==="
          for NAME in $(list_containers 11 | grep -i backend | cut -d' ' -f1); do
            fetch_logs 11 "${NAME}" /tmp/prod.log
            tr -d "\000" < /tmp/prod.log | grep -a "EpapoMeetingTokenIssuer\|CALLS_UNAVAILABLE\|api_error" | tail -8 | cut -c1-300
          done
