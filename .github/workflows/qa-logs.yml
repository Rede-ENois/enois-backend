name: QA Logs

on:
  push:
    branches: [chore/chamadas-diagnostico]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Logs do gateway e do backend
        env:
          PORTAINER_BASE_URL: ${{ secrets.PORTAINER_BASE_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
        run: |
          set -euo pipefail
          AUTH=(-H "X-API-Key: ${PORTAINER_API_KEY}" -H "Referer: ${PORTAINER_BASE_URL}")
          echo "=== containers no node3 (endpoint 12) ==="
          GAPI="${PORTAINER_BASE_URL}/api/endpoints/12/docker"
          curl -sS --max-time 30 "${AUTH[@]}" "${GAPI}/containers/json?all=1" -o /tmp/containers.json || echo "falha na listagem"
          python3 -c "import json;d=json.load(open('/tmp/containers.json'));print(*[(c.get('Names'),c.get('State'),c.get('Image')) for c in d],sep=chr(10))" || cat /tmp/containers.json | head -5
