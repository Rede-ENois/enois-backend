name: QA Logs

on:
  push:
    branches: [chore/chamadas-diagnostico]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Backend de producao, chamadas no log
        env:
          PORTAINER_BASE_URL: ${{ secrets.PORTAINER_BASE_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
        run: |
          set -euo pipefail
          AUTH=(-H "X-API-Key: ${PORTAINER_API_KEY}" -H "Referer: ${PORTAINER_BASE_URL}")
          API="${PORTAINER_BASE_URL}/api/endpoints/11/docker"
          curl -sS --max-time 60 "${AUTH[@]}" "${API}/containers/enois-prod-backend/logs?stdout=1&stderr=1&timestamps=1" -o /tmp/prod.log || echo "falhou"
          tr -d "\000" < /tmp/prod.log | wc -l
          tr -d "\000" < /tmp/prod.log | grep -aE "gateway do Epapo|CALLS_|CALL_ENTRY|/calls/|Epapo" | tail -40 || echo "nada"
