name: QA Logs

on:
  push:
    branches: [chore/chamadas-diagnostico]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Egress e handshake do host de producao
        env:
          PORTAINER_BASE_URL: ${{ secrets.PORTAINER_BASE_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
        run: |
          set +e
          AUTH=(-H "X-API-Key: ${PORTAINER_API_KEY}" -H "Referer: ${PORTAINER_BASE_URL}")
          EP="${PORTAINER_BASE_URL}/api/endpoints/11/docker"

          echo "=== app py dentro do backend (bash?) ==="
          curl -sS --max-time 60 "${AUTH[@]}" "${PORTAINER_BASE_URL}/api/endpoints/11/docker/containers/enois-prod-backend/json" -o /tmp/pj.json
          AUTOSTART=$(python3 -c "import json;print(json.load(open('/tmp/pj.json'))['Config']['Entrypoint'] if json.load(open('/tmp/pj.json'))['Config'].get('Entrypoint') else 'none')" 2>/dev/null)
          echo "entrypoint=$AUTOSTART"

          echo "=== IP publico visto pelo host de producao ==="
          curl -sS --max-time 15 https://api.ipify.org 2>&1; echo
          curl -sS --max-time 15 https://api.enois.ia.br/api/version 2>&1 | head -c 120; echo

          echo "=== node3 visto de fora (TCP 8122) a partir do runner hosted ==="
          for i in 1 2 3; do
            timeout 4 bash -c 'cat < /dev/null > /dev/tcp/185.111.156.15/8122' && echo "  $i tcp ok" || echo "  $i tcp falhou"
          done

          echo "=== ufw do node3 (via exec no container do gateway, se tiver tooling) ==="
          E=$(curl -sS --max-time 30 "${AUTH[@]}" -H "Content-Type: application/json" \
            -X POST "${PORTAINER_BASE_URL}/api/endpoints/12/docker/containers/epapo-prod-auth-gateway-1/exec" \
            -d '{"AttachStdout":true,"AttachStderr":true,"Cmd":["sh","-c","hostname -i 2>/dev/null; cat /proc/net/tcp 2>/dev/null | head -5; echo ---; ss -ltn 2>/dev/null | head -5"]}' \
            | python3 -c "import sys,json;print(json.load(sys.stdin).get('Id',''))")
          curl -sS --max-time 60 "${AUTH[@]}" -H "Content-Type: application/json" \
            -X POST "${PORTAINER_BASE_URL}/api/endpoints/12/docker/exec/${E}/start" -d '{"Detach":false,"Tty":false}' -o /tmp/e1 2>/dev/null
          tr -d "\000" < /tmp/e1 | head -c 600; echo
