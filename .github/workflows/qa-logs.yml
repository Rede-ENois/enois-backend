name: QA Logs

on:
  push:
    branches: [chore/chamadas-diagnostico]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logs:
    runs-on: [self-hosted, enois, docker-prod4]
    timeout-minutes: 10
    steps:
      - name: Cadeia do gateway como o backend a chama
        run: |
          set -uo pipefail
          echo "=== quem sou eu ==="
          curl -sS --max-time 10 https://ifconfig.me || true
          echo
          echo "=== token interno do container (so tamanho) ==="
          TOKEN=$(docker inspect enois-qa-backend --format "{{range .Config.Env}}{{println .}}{{end}}" | grep "^REDE_CALLS_EPAPO_INTERNAL_TOKEN=" | cut -d= -f2-)
          echo "tamanho=${#TOKEN}"
          URL=$(docker inspect enois-qa-backend --format "{{range .Config.Env}}{{println .}}{{end}}" | grep "^REDE_CALLS_EPAPO_GATEWAY_URL=" | cut -d= -f2-)
          echo "url=${URL}"
          CA=/etc/ssl/epapo-ca.pem
          docker exec enois-qa-backend sh -c "openssl version 2>/dev/null | head -1" || echo "sem openssl no container"
          echo "=== POST /auth/token (chamada inexistente: 403 entry_denied prova a cadeia) ==="
          curl -sS -o /tmp/out.txt -w "http=%{http_code} tempo=%{time_total}\n" --max-time 15 \
            --cacert <(docker exec -i enois-qa-backend sh -c "cat /tmp/epapo-gateway.crt 2>/dev/null") \
            -X POST "${URL%/}/auth/token" \
            -H "X-Epapo-Internal: ${TOKEN}" -H "Content-Type: application/json" \
            --data "{\"callId\":\"00000000-0000-0000-0000-000000000000\",\"userId\":\"00000000-0000-0000-0000-000000000000\"}" 2>&1 | tail -3
          head -c 300 /tmp/out.txt; echo
