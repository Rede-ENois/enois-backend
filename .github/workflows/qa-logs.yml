name: QA Logs

on:
  push:
    branches: [chore/chamadas-diagnostico]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gw:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: HTTP cru ao gateway a partir dos dois containers
        env:
          PORTAINER_BASE_URL: ${{ secrets.PORTAINER_BASE_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
        run: |
          set +e
          AUTH=(-H "X-API-Key: ${PORTAINER_API_KEY}" -H "Referer: ${PORTAINER_BASE_URL}")

          run_in() {
            local ep="$1" name="$2" cmd="$3"
            id=$(curl -sS --max-time 30 "${AUTH[@]}" -H "Content-Type: application/json" \
              -X POST "${PORTAINER_BASE_URL}/api/endpoints/${ep}/docker/containers/${name}/exec" \
              -d "$(python3 -c "import json,sys;print(json.dumps({'AttachStdout':True,'AttachStderr':True,'Cmd':['sh','-c',sys.argv[1]]}))" "$cmd")" \
              | python3 -c "import sys,json;print(json.load(sys.stdin).get('Id',''))")
            curl -sS --max-time 200 "${AUTH[@]}" -H "Content-Type: application/json" \
              -X POST "${PORTAINER_BASE_URL}/api/endpoints/${ep}/docker/exec/${id}/start" -d '{"Detach":false,"Tty":false}' -o /tmp/ex.out
            tr -d "\000" < /tmp/ex.out | head -c 1500
            echo
          }

          echo "=== QA: TCP e HTTP cru ao gateway ==="
          run_in 8 enois-qa-backend 'S=$(date +%s%N); timeout 8 bash -c "exec 3<>/dev/tcp/185.111.156.15/8122" 2>/dev/null; echo "tcp r=$? ms=$(( ($(date +%s%N)-S)/1000000 ))"; S=$(date +%s%N); printf "POST /auth/token HTTP/1.1\r\nHost: 185.111.156.15\r\nContent-Type: application/json\r\nContent-Length: 2\r\nConnection: close\r\n\r\n{}" | timeout 25 openssl s_client -quiet -connect 185.111.156.15:8122 2>/dev/null | head -c 300; echo; echo "http ms=$(( ($(date +%s%N)-S)/1000000 ))"'

          echo "=== PROD: HTTP cru ao gateway (sem openssl, usa java keytool ja provou TLS) ==="
          run_in 11 enois-prod-backend 'S=$(date +%s%N); timeout 8 bash -c "exec 3<>/dev/tcp/185.111.156.15/8122" 2>/dev/null; echo "tcp r=$? ms=$(( ($(date +%s%N)-S)/1000000 ))"; command -v openssl || echo sem-openssl'
