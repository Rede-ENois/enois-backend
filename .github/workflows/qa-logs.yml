name: QA Logs

on:
  push:
    branches: [chore/chamadas-diagnostico]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Tempo de TLS do container de producao ate o gateway
        env:
          PORTAINER_BASE_URL: ${{ secrets.PORTAINER_BASE_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
        run: |
          set +e
          AUTH=(-H "X-API-Key: ${PORTAINER_API_KEY}" -H "Referer: ${PORTAINER_BASE_URL}")
          EP="${PORTAINER_BASE_URL}/api/endpoints/11/docker"

          run_in() {
            local id
            id=$(curl -sS --max-time 30 "${AUTH[@]}" -H "Content-Type: application/json" \
              -X POST "${EP}/containers/enois-prod-backend/exec" \
              -d "$(python3 -c "import json,sys;print(json.dumps({'AttachStdout':True,'AttachStderr':True,'Cmd':['sh','-c',sys.argv[1]]}))" "$1")" \
              | python3 -c "import sys,json;print(json.load(sys.stdin).get('Id',''))")
            curl -sS --max-time 200 "${AUTH[@]}" -H "Content-Type: application/json" \
              -X POST "${EP}/exec/${id}/start" -d '{"Detach":false,"Tty":false}' -o /tmp/ex.out
            tr -d "\000" < /tmp/ex.out | head -c 2000
            echo
          }

          echo "=== JVM startup sozinho (3x) ==="
          run_in 'for i in 1 2 3; do S=$(date +%s%N); java -version >/dev/null 2>&1; E=$(date +%s%N); echo "java -version ms=$(( (E-S)/1000000 ))"; done'

          echo "=== TLS ate o gateway (3x) ==="
          run_in 'for i in 1 2 3; do S=$(date +%s%N); keytool -printcert -sslserver 185.111.156.15:8122 >/dev/null 2>&1; E=$(date +%s%N); echo "tls ms=$(( (E-S)/1000000 ))"; done'

          echo "=== TCP puro (3x) ==="
          run_in 'for i in 1 2 3; do S=$(date +%s%N); timeout 8 bash -c "exec 3<>/dev/tcp/185.111.156.15/8122" 2>/dev/null; R=$?; E=$(date +%s%N); echo "tcp r=$R ms=$(( (E-S)/1000000 ))"; done'

          echo "=== comparacao: TLS ate o proprio gateway pela porta do web (8120) ==="
          run_in 'S=$(date +%s%N); keytool -printcert -sslserver 185.111.156.15:8120 >/dev/null 2>&1; E=$(date +%s%N); echo "web8120 ms=$(( (E-S)/1000000 ))"'
