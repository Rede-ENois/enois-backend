name: QA Logs

on:
  push:
    branches: [chore/chamadas-diagnostico]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Comparar segredos entre containers (sem imprimir valores)
        env:
          PORTAINER_BASE_URL: ${{ secrets.PORTAINER_BASE_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
        run: |
          set -euo pipefail
          AUTH=(-H "X-API-Key: ${PORTAINER_API_KEY}" -H "Referer: ${PORTAINER_BASE_URL}")
          get() { curl -sS --max-time 30 "${AUTH[@]}" "${PORTAINER_BASE_URL}/api/endpoints/$1/docker/containers/$2/json"; }
          get 12 epapo-prod-auth-gateway-1 > /tmp/gw.json
          get 8 enois-qa-backend > /tmp/qa.json
          get 11 enois-backend > /tmp/pr.json
          for f in /tmp/gw.json /tmp/qa.json /tmp/pr.json; do
            echo "$f: $(head -c 120 $f)"; echo
          done
          python3 - <<PY
          import json
          def env(p):
              d=json.load(open(p))
              out={}
              for e in d["Config"]["Env"]:
                  k,_,v=e.partition("=")
                  out[k]=v
              return out
          gw=env("/tmp/gw.json"); qa=env("/tmp/qa.json"); pr=env("/tmp/pr.json")
          pairs=[
              ("QA interno  == gateway prod slot", qa.get("REDE_CALLS_EPAPO_INTERNAL_TOKEN"), gw.get("EPAPO_INTERNAL_TOKEN")),
              ("QA interno  == gateway QA slot", qa.get("REDE_CALLS_EPAPO_INTERNAL_TOKEN"), gw.get("EPAPO_INTERNAL_TOKEN_QA")),
              ("QA authorize== gateway QA slot", qa.get("REDE_CALLS_GATEWAY_AUTHORIZE_TOKEN"), gw.get("ENOIS_AUTHORIZE_SECRET_QA")),
              ("QA authorize== gateway prod slot", qa.get("REDE_CALLS_GATEWAY_AUTHORIZE_TOKEN"), gw.get("ENOIS_AUTHORIZE_SECRET")),
              ("PROD interno == gateway prod slot", pr.get("REDE_CALLS_EPAPO_INTERNAL_TOKEN"), gw.get("EPAPO_INTERNAL_TOKEN")),
              ("PROD authorize== gateway prod slot", pr.get("REDE_CALLS_GATEWAY_AUTHORIZE_TOKEN"), gw.get("ENOIS_AUTHORIZE_SECRET")),
          ]
          for name,a,b in pairs:
              print(f"{name}: {'IGUAL' if a and b and a==b else 'DIFERENTE/vazio'} (tam {len(a or '')} vs {len(b or '')})")
          print("QA url:", qa.get("REDE_CALLS_EPAPO_GATEWAY_URL"), "| host:", qa.get("REDE_CALLS_EPAPO_URL"))
          print("PROD url:", pr.get("REDE_CALLS_EPAPO_GATEWAY_URL"), "| host:", pr.get("REDE_CALLS_EPAPO_URL"))
          PY
