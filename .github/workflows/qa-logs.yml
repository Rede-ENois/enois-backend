name: QA Logs

on:
  push:
    branches: [chore/chamadas-diagnostico]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gw:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: HttpClient do Java dentro dos containers
        env:
          PORTAINER_BASE_URL: ${{ secrets.PORTAINER_BASE_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
        run: |
          set +e
          AUTH=(-H "X-API-Key: ${PORTAINER_API_KEY}" -H "Referer: ${PORTAINER_BASE_URL}")
          SCRIPT="{ echo '== env keys'; env | cut -d= -f1 | grep -i -E 'epapo|calls|gateway|rede'; echo '== all keys'; env | cut -d= -f1 | tr '\n' ' '; echo; echo '== files'; ls -1 /app 2>/dev/null | head -20; echo '== probe'; mkdir -p /tmp/p && printf '%s' '' | base64 -d > /tmp/p/Probe.class && cd /tmp/p && java Probe \"\$REDE_CALLS_EPAPO_GATEWAY_URL/auth/token\" \"\$REDE_CALLS_EPAPO_INTERNAL_TOKEN\" 2>&1; echo '== end'; } > /tmp/probe.out 2>&1; cat /tmp/probe.out"
          run_in() {
            EP="$1"; NAME="$2"
            id=$(curl -sS --max-time 30 "${AUTH[@]}" -H "Content-Type: application/json" \
              -X POST "${PORTAINER_BASE_URL}/api/endpoints/${EP}/docker/containers/${NAME}/exec" \
              -d "$(python3 -c "import json,sys;print(json.dumps({'AttachStdout':True,'AttachStderr':True,'Cmd':['sh','-c',sys.argv[1]]}))" "$SCRIPT")" \
              | python3 -c "import sys,json;print(json.load(sys.stdin).get('Id',''))")
            curl -sS --max-time 200 "${AUTH[@]}" -H "Content-Type: application/json" \
              -X POST "${PORTAINER_BASE_URL}/api/endpoints/${EP}/docker/exec/${id}/start" -d '{"Detach":false,"Tty":false}' -o /tmp/ex.out
            tr -d "\000" < /tmp/ex.out | head -c 12000
            echo
          }
          echo "=== QA ==="
          run_in 8 enois-qa-backend
          echo "=== PROD ==="
          run_in 11 enois-prod-backend
