name: QA Logs

on:
  push:
    branches: [chore/chamadas-diagnostico]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Motivo real da recusa
        env:
          PORTAINER_BASE_URL: ${{ secrets.PORTAINER_BASE_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
        run: |
          set -euo pipefail
          AUTH=(-H "X-API-Key: ${PORTAINER_API_KEY}" -H "Referer: ${PORTAINER_BASE_URL}")
          API="${PORTAINER_BASE_URL}/api/endpoints/11/docker"
          curl -sS --max-time 60 "${AUTH[@]}" "${API}/containers/enois-prod-backend/logs?stdout=1&stderr=1&timestamps=1" -o /tmp/p.log || true
          tr -d "\000" < /tmp/p.log | grep -a "EpapoMeetingTokenIssuer" | tail -14 | python3 -c "
          import sys, json
          for line in sys.stdin:
              i = line.find('{')
              if i < 0: continue
              try:
                  d = json.loads(line[i:])
              except Exception:
                  continue
              print(d.get('@timestamp'), d.get('log',{}).get('level'), '|', d.get('message'))
          "
