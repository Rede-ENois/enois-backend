name: QA Logs

on:
  push:
    branches: [chore/chamadas-diagnostico]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Inspecao das chamadas
        env:
          PORTAINER_BASE_URL: ${{ secrets.PORTAINER_BASE_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
        run: |
          set +e
          AUTH=(-H "X-API-Key: ${PORTAINER_API_KEY}" -H "Referer: ${PORTAINER_BASE_URL}")
          BASE="${PORTAINER_BASE_URL}/api/endpoints"

          echo "=== PROD container enois-prod-backend ==="
          curl -sS --max-time 60 "${AUTH[@]}" "${BASE}/11/docker/containers/enois-prod-backend/json" -o /tmp/pj.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/pj.json'))
          print("id", d.get('Id','')[:12])
          print("image", d.get('Config',{}).get('Image'))
          print("created", d.get('Created'))
          print("started", d.get('State',{}).get('StartedAt'))
          print("health", d.get('State',{}).get('Health'))
          print("network", d.get('HostConfig',{}).get('NetworkMode'))
          envs = {}
          for e in d.get('Config',{}).get('Env') or []:
              k, _, v = e.partition('=')
              envs[k] = v
          for k in sorted(envs):
              if any(s in k.upper() for s in ('CALL','EPAPO','JAVA_OPTS','JAVA_TOOL')):
                  print(k, '=', ('<vazio>' if envs[k] == '' else '<definido len=%d>' % len(envs[k])))
          PY

          echo "=== PROD: msgs completas de chamadas (log do container atual) ==="
          curl -sS --max-time 180 -o /tmp/prod.log "${AUTH[@]}" \
            "${BASE}/11/docker/containers/enois-prod-backend/logs?stdout=1&stderr=1&timestamps=1"
          echo "bytes=$(wc -c < /tmp/prod.log)"
          tr -d "\000" < /tmp/prod.log | grep -a "EpapoMeetingTokenIssuer\|CALLS_UNAVAILABLE" | tail -n 6 | python3 -c '
          import sys, json
          for line in sys.stdin:
              i = line.find("{")
              if i < 0: continue
              try: d = json.loads(line[i:])
              except Exception: continue
              print(d.get("@timestamp"), d.get("log",{}).get("level"), "|", d.get("message"))
          '

          echo "=== PROD: /version publico ==="
          curl -sS --max-time 20 https://api.enois.ia.br/api/version; echo
          echo "=== PROD: /health publico ==="
          curl -sS --max-time 20 https://api.enois.ia.br/health; echo
          echo "=== QA: /version publico ==="
          curl -sS --max-time 20 https://enois-api-qa.b7cloud.tech/api/version; echo

          echo "=== QA container enois-qa-backend ==="
          curl -sS --max-time 60 "${AUTH[@]}" "${BASE}/8/docker/containers/enois-qa-backend/json" -o /tmp/qj.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/qj.json'))
          print("id", d.get('Id','')[:12])
          print("image", d.get('Config',{}).get('Image'))
          print("created", d.get('Created'))
          print("started", d.get('State',{}).get('StartedAt'))
          envs = {}
          for e in d.get('Config',{}).get('Env') or []:
              k, _, v = e.partition('=')
              envs[k] = v
          for k in sorted(envs):
              if any(s in k.upper() for s in ('CALL','EPAPO')):
                  print(k, '=', ('<vazio>' if envs[k] == '' else '<definido len=%d>' % len(envs[k])))
          PY
