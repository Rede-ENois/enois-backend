name: QA Logs

on:
  push:
    branches: [chore/chamadas-diagnostico]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gw:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Chamadas por ambiente
        env:
          PORTAINER_BASE_URL: ${{ secrets.PORTAINER_BASE_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
        run: |
          set +e
          dump() {
            curl -sS --max-time 180 \
              -H "X-API-Key: ${PORTAINER_API_KEY}" -H "Referer: ${PORTAINER_BASE_URL}" \
              "${PORTAINER_BASE_URL}/api/endpoints/$1/docker/containers/$2/logs?stdout=1&stderr=1&timestamps=1&tail=200000" \
              -o /tmp/b.log
            echo "bytes=$(wc -c < /tmp/b.log)"
            tr -d "\000" < /tmp/b.log
          }
          report() {
            L=/tmp/c.log; dump "$1" "$2" > $L
            echo "--- total calls paths: $(grep -ac '/calls/' $L)"
            echo "--- status por rota de chamada:"
            grep -a -oE '"path":"/calls[^"]*".{0,400}' $L | grep -aoE '"path":"/calls[^"]*"|"status":[0-9]+' | paste - - 2>/dev/null | sort | uniq -c | sort -rn | head -25
            echo "--- mensagens de erro de chamada:"
            grep -a -oE '"message":"[^"]{0,160}"' $L | grep -aiE "call|epapo" | sort | uniq -c | sort -rn | head -20
          }
          echo "=== QA ==="; report 8 enois-qa-backend
          echo "=== PROD ==="; report 11 enois-prod-backend
