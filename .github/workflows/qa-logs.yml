name: QA Logs

on:
  push:
    branches: [chore/chamadas-diagnostico]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Alcance do gateway de dentro do container de producao
        env:
          PORTAINER_BASE_URL: ${{ secrets.PORTAINER_BASE_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
        run: |
          set +e
          AUTH=(-H "X-API-Key: ${PORTAINER_API_KEY}" -H "Referer: ${PORTAINER_BASE_URL}")
          EP="${PORTAINER_BASE_URL}/api/endpoints/11/docker"

          run_in() {
            local cmd="$1"
            local id
            id=$(curl -sS --max-time 30 "${AUTH[@]}" -H "Content-Type: application/json" \
              -X POST "${EP}/containers/enois-prod-backend/exec" \
              -d "$(python3 -c "import json,sys;print(json.dumps({'AttachStdout':True,'AttachStderr':True,'Cmd':['sh','-c',sys.argv[1]]}))" "$cmd")" \
              | python3 -c "import sys,json;print(json.load(sys.stdin).get('Id',''))")
            curl -sS --max-time 60 "${AUTH[@]}" -H "Content-Type: application/json" \
              -X POST "${EP}/exec/${id}/start" -d '{"Detach":false,"Tty":false}' -o /tmp/ex.out
            tr -d "\000" < /tmp/ex.out | head -c 900
            echo
          }

          echo "=== ferramentas disponiveis ==="
          run_in 'for b in bash sh curl wget nc openssl java keytool; do command -v $b >/dev/null && echo "tem $b"; done'

          echo "=== TCP 8122 a partir do container de producao ==="
          run_in 'if command -v bash >/dev/null; then for i in 1 2 3; do timeout 4 bash -c "cat < /dev/null > /dev/tcp/185.111.156.15/8122" && echo "$i ok" || echo "$i falhou"; done; else echo "sem bash"; fi'

          echo "=== CA do gateway no cacerts da imagem de producao ==="
          run_in 'keytool -list -alias epapo-gateway -keystore "$JAVA_HOME/lib/security/cacerts" -storepass changeit 2>&1 | head -4'
