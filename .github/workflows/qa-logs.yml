name: QA Logs

on:
  push:
    branches: [chore/chamadas-diagnostico]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gw:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Callback do gateway com o segredo real (node)
        env:
          PORTAINER_BASE_URL: ${{ secrets.PORTAINER_BASE_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
        run: |
          set +e
          AUTH=(-H "X-API-Key: ${PORTAINER_API_KEY}" -H "Referer: ${PORTAINER_BASE_URL}")
          API="${PORTAINER_BASE_URL}/api/endpoints/12/docker"

          run_node() {
            id=$(curl -sS --max-time 30 "${AUTH[@]}" -H "Content-Type: application/json" \
              -X POST "${API}/containers/epapo-prod-auth-gateway-1/exec" \
              -d "$(python3 -c "import json,sys;print(json.dumps({'AttachStdout':True,'AttachStderr':True,'Cmd':['node','-e',sys.argv[1]]}))" "$1")" \
              | python3 -c "import sys,json;print(json.load(sys.stdin).get('Id',''))")
            curl -sS --max-time 200 "${AUTH[@]}" -H "Content-Type: application/json" \
              -X POST "${API}/exec/${id}/start" -d '{"Detach":false,"Tty":false}' -o /tmp/ex.out
            tr -d "\000" < /tmp/ex.out | head -c 2000
            echo
          }

          echo "=== callback real (interna e publica) ==="
          run_node 'const https=require("https");const u=process.env.ENOIS_BACKEND_URL.replace(/\/$/,"")+"/calls/00000000-0000-0000-0000-000000000000/gateway/entry/00000000-0000-0000-0000-000000000000";const urls=[u,"https://api.enois.ia.br/api/calls/00000000-0000-0000-0000-000000000000/gateway/entry/00000000-0000-0000-0000-000000000000"];(async()=>{for(const url of urls){for(let i=0;i<3;i++){const t=Date.now();await new Promise(r=>{const q=https.request(url,{method:"POST",headers:{Accept:"application/json","Content-Length":0,"X-Enois-Authorize":process.env.ENOIS_AUTHORIZE_SECRET},timeout:20000},res=>{let b="";res.on("data",c=>b+=c);res.on("end",()=>{console.log(url.includes("api.enois.ia.br")?"publica":"interna","status",res.statusCode,"ms",Date.now()-t,b.slice(0,90));r()})});q.on("timeout",()=>{console.log("TIMEOUT ms",Date.now()-t);q.destroy();r()});q.on("error",e=>{console.log("ERRO",e.code||e.message,"ms",Date.now()-t);r()});q.end()})}}})()'
