name: QA Logs

on:
  push:
    branches: [chore/chamadas-diagnostico]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Emissao real do token, com o token do container
        env:
          PORTAINER_BASE_URL: ${{ secrets.PORTAINER_BASE_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
        run: |
          set +e
          AUTH=(-H "X-API-Key: ${PORTAINER_API_KEY}" -H "Referer: ${PORTAINER_BASE_URL}")
          EP="${PORTAINER_BASE_URL}/api/endpoints/11/docker"
          curl -sS --max-time 60 "${AUTH[@]}" "${EP}/containers/enois-prod-backend/json" -o /tmp/pj.json
          curl -sS --max-time 60 "${AUTH[@]}" "${PORTAINER_BASE_URL}/api/endpoints/12/docker/containers/epapo-prod-auth-gateway-1/json" -o /tmp/gw.json
          python3 - <<'PY' > /tmp/env.txt
          import json
          def env(p):
              d = json.load(open(p)); out = {}
              for e in d.get('Config',{}).get('Env') or []:
                  k, _, v = e.partition('='); out[k] = v
              return out
          b = env('/tmp/pj.json'); g = env('/tmp/gw.json')
          print(b.get('REDE_CALLS_EPAPO_GATEWAY_URL',''))
          print(b.get('REDE_CALLS_EPAPO_INTERNAL_TOKEN',''))
          print('iguais' if b.get('REDE_CALLS_EPAPO_INTERNAL_TOKEN') == g.get('EPAPO_INTERNAL_TOKEN') else 'DIFERENTES')
          print('iguais' if b.get('REDE_CALLS_GATEWAY_AUTHORIZE_TOKEN') == g.get('ENOIS_AUTHORIZE_SECRET') else 'DIFERENTES')
          PY
          GW=$(sed -n 1p /tmp/env.txt); TOK=$(sed -n 2p /tmp/env.txt)
          echo "token interno: $(sed -n 3p /tmp/env.txt); authorize: $(sed -n 4p /tmp/env.txt)"
          echo "=== /auth/token chamado do runner (id inexistente) ==="
          for i in 1 2; do
            curl -sS -o /tmp/tk.out -w "  code=%{http_code} connect=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total}\n" \
              --connect-timeout 5 --max-time 40 -X POST "${GW%/}/auth/token" \
              -H "X-Epapo-Internal: ${TOK}" -H "Content-Type: application/json" \
              --data '{"callId":"00000000-0000-0000-0000-000000000000","userId":"00000000-0000-0000-0000-000000000000"}'
            head -c 160 /tmp/tk.out; echo
          done
