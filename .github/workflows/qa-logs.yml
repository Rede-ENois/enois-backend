name: QA Logs

on:
  push:
    branches: [chore/chamadas-diagnostico]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag-no-host-de-producao:
    runs-on: [self-hosted, enois]
    timeout-minutes: 15
    steps:
      - name: Caminho do backend ate o gateway
        env:
          PORTAINER_BASE_URL: ${{ secrets.PORTAINER_BASE_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
        run: |
          set +e
          echo "host=$(hostname) ip=$(ip -4 route get 1.1.1.1 2>/dev/null | grep -o 'src [0-9.]*' | head -1)"
          AUTH=(-H "X-API-Key: ${PORTAINER_API_KEY}" -H "Referer: ${PORTAINER_BASE_URL}")
          API="${PORTAINER_BASE_URL}/api/endpoints/11/docker"
          curl -sS --max-time 60 "${AUTH[@]}" "${API}/containers/enois-prod-backend/json" -o /tmp/pj.json
          python3 - <<'PY' > /tmp/gwurl.txt
          import json
          d = json.load(open('/tmp/pj.json'))
          for e in d.get('Config',{}).get('Env') or []:
              if e.startswith('REDE_CALLS_EPAPO_GATEWAY_URL='):
                  print(e.split('=',1)[1])
          PY
          GW=$(cat /tmp/gwurl.txt)
          echo "gateway url (host/porta): $(printf '%s' "$GW" | sed -E 's#^(https?://[^/:]+(:[0-9]+)?).*#\1#')"
          HOSTPORT=$(printf '%s' "$GW" | sed -E 's#^https?://##; s#/.*$##')
          echo "=== TCP 8122/GW ==="
          timeout 8 bash -c "cat < /dev/null > /dev/tcp/${HOSTPORT%:*}/${HOSTPORT##*:}" && echo "tcp ok" || echo "tcp falhou/expirou"
          echo "=== curl sem TLS (handshake) ==="
          curl -sS -o /dev/null -w 'code=%{http_code} dns=%{time_namelookup} connect=%{time_connect} tls=%{time_appconnect} total=%{time_total}\n' \
            --connect-timeout 5 --max-time 15 -X POST "${GW%/}/auth/token" \
            -H "Content-Type: application/json" --data '{}' 2>&1 | tail -3
          echo "=== TLS detalhe ==="
          echo | timeout 12 openssl s_client -connect "${HOSTPORT}" -brief 2>&1 | tail -12
          echo "=== rota ==="
          ip route get "${HOSTPORT%:*}" 2>/dev/null | head -2
          echo "=== containers epapo vistos do host (se houver docker) ==="
          docker ps --format '{{.Names}} {{.Status}}' 2>&1 | head -20
