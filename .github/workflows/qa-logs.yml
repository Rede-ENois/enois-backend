name: QA Logs

on:
  push:
    branches: [chore/chamadas-diagnostico]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gw:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Logs do gateway
        env:
          PORTAINER_BASE_URL: ${{ secrets.PORTAINER_BASE_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
        run: |
          set +e
          curl -sS --max-time 90 \
            -H "X-API-Key: ${PORTAINER_API_KEY}" -H "Referer: ${PORTAINER_BASE_URL}" \
            "${PORTAINER_BASE_URL}/api/endpoints/12/docker/containers/epapo-prod-auth-gateway-1/logs?stdout=1&stderr=1&timestamps=1&tail=4000" \
            -o /tmp/gw.log
          ls -l /tmp/gw.log
          tr -d "\000" < /tmp/gw.log | grep -a -i -E "authorize|502|timeout|entry_denied|error" | tail -40
