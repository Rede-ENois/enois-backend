name: QA Logs

on:
  push:
    branches: [chore/chamadas-diagnostico]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: [self-hosted, enois]
    timeout-minutes: 15
    steps:
      - name: Handshake em granularidade fina do host de producao
        run: |
          set +e
          echo "host=$(hostname)"
          echo "=== IPv4 do host ==="
          ip -4 -o addr show scope global | awk '{print $2, $4}'
          echo "=== IPv6 default ==="
          ip -6 route | head -5
          echo "=== getent ==="
          getent ahostsv4 api.enois.ia.br | head -3
          getent hosts api.enois.ia.br | head -3
          echo "=== TCP 8122 (IPv4, 10 tentativas) ==="
          for i in $(seq 1 10); do
            timeout 3 bash -c 'cat < /dev/null > /dev/tcp/185.111.156.15/8122' && echo "  $i ok" || echo "  $i falhou"
          done
          echo "=== curl -4 com verbose do connect ==="
          curl -4 -v -o /dev/null --connect-timeout 6 --max-time 10 -X POST https://185.111.156.15:8122/auth/token -H 'Content-Type: application/json' --data '{}' 2>&1 | grep -E "Trying|Connected|TLS|SSL|error|timed|timed out" | head -12
          echo "=== porta de origem usada (ss) ==="
          ss -tnp 2>/dev/null | grep 8122 | head -5
          echo "=== ip route get 185.111.156.15 ==="
          ip route get 185.111.156.15 | head -3
          echo "=== rota dentro do container do backend ==="
