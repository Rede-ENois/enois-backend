name: QA Logs

on:
  push:
    branches: [chore/chamadas-diagnostico]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Certificado servido pelo gateway
        run: |
          set -uo pipefail
          for host in 185.111.156.15 enois3.b7cloud.tech; do
            echo "=== $host:8122 ==="
            timeout 15 openssl s_client -connect ${host}:8122 -servername ${host} -showcerts </dev/null 2>&1 | \
              grep -E "subject=|issuer=|verify|Verification|CN *=" | head -10
            echo "--- handshake sem SNI ---"
            timeout 15 openssl s_client -connect ${host}:8122 </dev/null 2>&1 | grep -E "verify|Verification|subject=" | head -5
          done
