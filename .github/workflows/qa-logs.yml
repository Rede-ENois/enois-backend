name: QA Logs

on:
  push:
    branches: [chore/chamadas-diagnostico]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gw:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Erros 500 na rota de autorizacao
        env:
          PORTAINER_BASE_URL: ${{ secrets.PORTAINER_BASE_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
        run: |
          set +e
          curl -sS --max-time 180 \
            -H "X-API-Key: ${PORTAINER_API_KEY}" -H "Referer: ${PORTAINER_BASE_URL}" \
            "${PORTAINER_BASE_URL}/api/endpoints/11/docker/containers/enois-prod-backend/logs?stdout=1&stderr=1&timestamps=1&tail=400000" \
            -o /tmp/b.log
          tr -d "\000" < /tmp/b.log > /tmp/c.log
          echo "-- mensagens de erro (api_error) com codigo:"
          grep -a -oE '"message":"api_error[^"]{0,200}"' /tmp/c.log | sed -E 's/requestId=[a-f0-9]+//' | sort | uniq -c | sort -rn | head -20
          echo "-- linhas de excecao:"
          grep -a -oE '"(message|error)":"[^"]{0,200}"' /tmp/c.log | grep -aiE "lock|deadlock|timeout|wait|jdbc|sql" | sort | uniq -c | sort -rn | head -20
          echo "-- stacktrace de lock:"
          grep -a -iE "Lock wait timeout|Deadlock found|CannotAcquireLock|PessimisticLock" /tmp/c.log | head -5 | cut -c1-300
