name: QA Logs

on:
  push:
    branches: [chore/chamadas-diagnostico]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Logs do gateway e do backend
        env:
          PORTAINER_BASE_URL: ${{ secrets.PORTAINER_BASE_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
        run: |
          set -euo pipefail
          AUTH=(-H "X-API-Key: ${PORTAINER_API_KEY}" -H "Referer: ${PORTAINER_BASE_URL}")

          echo "=== containers no node3 (endpoint 12) ==="
          GAPI="${PORTAINER_BASE_URL}/api/endpoints/12/docker"
          curl -sS --max-time 30 "${AUTH[@]}" "${GAPI}/containers/json?all=1" \
            | python3 -c 'import json,sys
for c in json.load(sys.stdin): print(c.get("Names"), c.get("State"))' || echo falhou

          echo "=== varredura TLS/firewall: node3 fala com o backend da QA? ==="
          curl -sS --max-time 30 "${AUTH[@]}" "${GAPI}/containers/json?all=1&filters=%7B%22name%22%3A%5B%22auth-gateway%22%5D%7D" \
            | python3 -c 'import json,sys
print([c["Id"][:12] for c in json.load(sys.stdin)])'
