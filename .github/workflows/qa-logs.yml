name: QA Logs

on:
  push:
    branches: [chore/chamadas-diagnostico]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ler logs do container da QA
        env:
          PORTAINER_BASE_URL: ${{ secrets.PORTAINER_BASE_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
        run: |
          set -euo pipefail
          API="${PORTAINER_BASE_URL}/api/endpoints/8/docker"
          AUTH=(-H "X-API-Key: ${PORTAINER_API_KEY}" -H "Referer: ${PORTAINER_BASE_URL}")
          echo "=== tamanho total do log (linhas) ==="
          curl -sS --max-time 60 "${AUTH[@]}" \
            "${API}/containers/enois-qa-backend/logs?stdout=1&stderr=1" \
            | tr -d '\000' | wc -l
          echo "=== linhas com /calls, 503 ou gateway ==="
          curl -sS --max-time 60 "${AUTH[@]}" \
            "${API}/containers/enois-qa-backend/logs?stdout=1&stderr=1" \
            | tr -d '\000' | grep -aiE "/calls|CALLS_|gateway do epapo|status=5" | tail -40 \
            || echo "nada"
