name: Sugerir uma melhoria
description: Uma ideia de funcionalidade, de regra ou de operação
labels: ["enhancement"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Que problema isso resolve
      description: Descreva a situação, não a solução técnica.
    validations:
      required: true
  - type: textarea
    id: proposta
    attributes:
      label: O que você imagina
    validations:
      required: true
  - type: textarea
    id: impacto
    attributes:
      label: Impacto em dados e migrações
      description: Precisa de tabela nova? Muda contrato de API já publicado?
    validations:
      required: false
  - type: textarea
    id: plano
    attributes:
      label: Plano de implementação
      description: >
        Quais arquivos/módulos mudam, quais casos-limite precisam de teste e como a entrega será
        provada. A PR desta feature referencia esta issue — plano vago vira código vago.
    validations:
      required: true
  - type: textarea
    id: prova
    attributes:
      label: Como vai ser provado
      description: Qual teste novo, qual teste de regressão, o que será conferido à mão.
    validations:
      required: true
