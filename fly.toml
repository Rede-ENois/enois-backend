app = "rede"
primary_region = "iad"

[env]
  SPRING_PROFILES_ACTIVE = "qa"
  SERVER_ADDRESS = "0.0.0.0"
  JAVA_TOOL_OPTIONS = "-Xmx1536m -Xss512k -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=128m -XX:+UseParallelGC -XX:+TieredCompilation -XX:TieredStopAtLevel=1 -Djava.security.egd=file:/dev/./urandom"

[http_service]
  auto_start_machines = true
  auto_stop_machines = "off"
  force_https = true
  internal_port = 8081
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048
