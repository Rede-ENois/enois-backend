spring.datasource.url=jdbc:h2:mem:rede;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# OAuth SSO - dev
rede.oauth.frontend-redirect-url=http://localhost:5173/auth/callback
rede.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
rede.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
rede.oauth.google.redirect-uri=http://localhost:8081/api/auth/oauth/google/callback
rede.oauth.apple.client-id=${APPLE_CLIENT_ID:}
rede.oauth.apple.team-id=${APPLE_TEAM_ID:}
rede.oauth.apple.key-id=${APPLE_KEY_ID:}
rede.oauth.apple.private-key=${APPLE_PRIVATE_KEY:}
rede.oauth.apple.redirect-uri=http://localhost:8081/api/auth/oauth/apple/callback

# Frontend URL - dev
rede.frontend.url=${FRONTEND_URL:}

