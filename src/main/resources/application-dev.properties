spring.datasource.url=jdbc:h2:mem:rede;MODE=MySQL;DB_CLOSE_DELAY=-1
rede.media.nsfw.enabled=${REDE_MEDIA_NSFW_ENABLED:false}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# OAuth SSO - dev
rede.oauth.frontend-redirect-url=http://localhost:5173/auth/callback
rede.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
rede.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
rede.oauth.google.redirect-uri=http://localhost:8081/api/auth/oauth/google/callback
rede.oauth.apple.client-id=${APPLE_CLIENT_ID:}
rede.oauth.apple.team-id=${APPLE_TEAM_ID:}
rede.oauth.apple.key-id=${APPLE_KEY_ID:}
rede.oauth.apple.private-key=${APPLE_PRIVATE_KEY:}
rede.oauth.apple.redirect-uri=http://localhost:8081/api/auth/oauth/apple/callback

# Swagger/OpenAPI ligados apenas em dev (em qa/prd ficam desligados; ver application.properties)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Frontend URL - dev
rede.frontend.url=${FRONTEND_URL:}


# Pentest F-02/F-04: os tetos de credenciais abrem no dev (a suíte cria centenas de contas do mesmo IP)
rede.auth.throttle.login-max-failures=100
rede.auth.throttle.signup-per-hour=100000

# Local frontend (Vite) is allowed only in dev.
rede.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://enois.ia.br,https://enois-qa.b7cloud.tech,http://localhost:5173}

# Local dev runs over plain http: the session cookies cannot be Secure there.
rede.auth.cookie-secure=false

# Local dev may run without REDE_SECURITY_ENCRYPTION_KEY (TOTP stays unavailable). As chaves de teste
# do Turnstile ja sao inertes em qualquer ambiente (rede.turnstile.test-key-policy=degrade e o default).
rede.security.encryption-key-required=false
