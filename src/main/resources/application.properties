server.port=8081
server.address=0.0.0.0
spring.application.name=rede
spring.profiles.active=dev
spring.main.lazy-initialization=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.data.jpa.repositories.bootstrap-mode=deferred
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework=INFO
resilience4j.retry.instances.mediaStorage.max-attempts=3
resilience4j.retry.instances.mediaStorage.wait-duration=250ms
resilience4j.circuitbreaker.instances.mediaStorage.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.mediaStorage.sliding-window-size=10
resilience4j.circuitbreaker.instances.mediaStorage.minimum-number-of-calls=5
resilience4j.bulkhead.instances.mediaStorage.max-concurrent-calls=4
resilience4j.bulkhead.instances.mediaStorage.max-wait-duration=0
resilience4j.ratelimiter.instances.auth.limit-for-period=20
resilience4j.ratelimiter.instances.auth.limit-refresh-period=1m
resilience4j.ratelimiter.instances.auth.timeout-duration=0
resilience4j.ratelimiter.instances.search.limit-for-period=60
resilience4j.ratelimiter.instances.search.limit-refresh-period=1m
resilience4j.ratelimiter.instances.search.timeout-duration=0

springdoc.api-docs.path=/api/openapi.json
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.show-actuator=false

# Actuator monitoring
management.endpoints.web.exposure.include=health,prometheus,metrics,info
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.web.server.request.autotime.enabled=true

# Feed cache configuration
rede.feed.cache.max-items-per-user=500
rede.feed.cache.ttl-seconds=3600

# Feed distribution configuration
rede.feed.distribution.max-fanout=500

# ImageKit CDN
rede.media.imagekit.url-endpoint=https://ik.imagekit.io/socialcoisa/
