server.port=8081
server.address=0.0.0.0
# O /storage transmite vídeos grandes por StreamingResponseBody. O timeout padrão do container
# (30s) cortava uma reprodução lenta no meio e o cliente via 500; 5 min cobre o arquivo inteiro.
spring.mvc.async.request-timeout=300000
spring.application.name=rede
# No default profile: SPRING_PROFILES_ACTIVE must be set explicitly (RedeApplication refuses to boot
# without one). Local `./mvnw spring-boot:run` gets `dev` from the pom.
spring.main.lazy-initialization=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.data.jpa.repositories.bootstrap-mode=deferred
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework=INFO
# Limite de upload do Servlet. O padrao do Boot e 1 MB, e o import do LinkedIn aceita ate 5 MB
# (`LinkedinImportService.MAX_ZIP_BYTES`) — sem isto, o ZIP de 2,5 MB era recusado ANTES de chegar
# ao controller, com um 500 generico ("erro interno") que nao dizia o que fazer. Os valores ficam
# acima do limite do servico de proposito: quem recusa com mensagem clara e o proprio servico.
spring.servlet.multipart.max-file-size=520MB
spring.servlet.multipart.max-request-size=540MB
# Uncompressed budget of the LinkedIn ZIP import (all entries together); crossing it returns 413.
rede.import.linkedin.max-uncompressed-bytes=${REDE_IMPORT_LINKEDIN_MAX_UNCOMPRESSED_BYTES:8388608}
resilience4j.retry.instances.mediaStorage.max-attempts=3
resilience4j.retry.instances.mediaStorage.wait-duration=250ms
resilience4j.circuitbreaker.instances.mediaStorage.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.mediaStorage.sliding-window-size=10
resilience4j.circuitbreaker.instances.mediaStorage.minimum-number-of-calls=5
resilience4j.bulkhead.instances.mediaStorage.max-concurrent-calls=4
resilience4j.bulkhead.instances.mediaStorage.max-wait-duration=0
# Bucket global de autenticação: rede de segurança, não o limite principal (que é por
# IP/conta). 120/min por pod: o feed renova sessão e valida login em rajada; teto baixo aqui
# derrubava gente honesta junto com atacante (o limite que pune de verdade é o por IP/conta).
resilience4j.ratelimiter.instances.auth.limit-for-period=300
resilience4j.ratelimiter.instances.auth.limit-refresh-period=1m
resilience4j.ratelimiter.instances.auth.timeout-duration=0
# Buckets separados: uma enxurrada de 2FA não consome a cota do login (e vice-versa).
resilience4j.ratelimiter.instances.twofa.limit-for-period=60
resilience4j.ratelimiter.instances.twofa.limit-refresh-period=1m
resilience4j.ratelimiter.instances.twofa.timeout-duration=0
resilience4j.ratelimiter.instances.refresh.limit-for-period=120
resilience4j.ratelimiter.instances.refresh.limit-refresh-period=1m
resilience4j.ratelimiter.instances.refresh.timeout-duration=0
resilience4j.ratelimiter.instances.search.limit-for-period=120
resilience4j.ratelimiter.instances.search.limit-refresh-period=1m
resilience4j.ratelimiter.instances.search.timeout-duration=0
# Endpoints que disparam e-mail (reset de senha e reenvio de confirmacao): o limite e por IP, para
# o endpoint nao virar ferramenta de spam contra a caixa de entrada de terceiros. O reenvio de
# confirmacao ainda tem um segundo limite por usuario dentro do AuthService.
# Rede de segurança GLOBAL (o limite que vale de verdade é o por IP, em rede.security.rate-limit):
# um teto baixo aqui deixaria um único atacante consumir a cota e derrubar o acesso de todo mundo.
resilience4j.ratelimiter.instances.email-sending.limit-for-period=200
resilience4j.ratelimiter.instances.email-sending.limit-refresh-period=15m
resilience4j.ratelimiter.instances.email-sending.timeout-duration=0

# OpenAPI/Swagger desligados por padrao: o gateway expoe o backend em /api/* sem autenticacao,
# entao o doc (mapa completo da API) e o Swagger UI ficariam publicos. Para habilitar (dev/uso
# interno atras de VPN), defina SPRINGDOC_ENABLED=true.
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}
springdoc.api-docs.path=/api/openapi.json
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.show-actuator=false

# Actuator: so health e exposto por padrao. prometheus/metrics/* expunham metricas internas
# (JVM, pool de conexoes, URIs) para qualquer um via /api/actuator/*.
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:health}
# Nao publica o indice /actuator (descoberta de endpoints); os endpoints expostos seguem acessiveis.
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=when-authorized
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.web.server.request.autotime.enabled=true
# Latency histogram buckets so Grafana can compute p95/p99 per route (histogram_quantile).
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# /livez and /readyz on the main port: probes keep working if the actuator moves to its own port
# (env MANAGEMENT_SERVER_PORT) to take /prometheus off the public gateway.
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true

# Observability: metrics are pulled by Prometheus, so the OTLP metrics push (on by default with the
# OpenTelemetry starter, pointing at localhost:4318) stays off.
management.otlp.metrics.export.enabled=false
# Traces are exported only when an OTLP endpoint is configured, e.g.
# MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://alloy.monitoring:4318/v1/traces
# Without it, traceId/spanId still land in every log line for correlation.
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
logging.structured.ecs.service.name=${spring.application.name}
logging.structured.ecs.service.environment=${SPRING_PROFILES_ACTIVE:dev}

# Feed cache configuration
rede.feed.cache.max-items-per-user=500
rede.feed.cache.ttl-seconds=3600

# Feed distribution configuration
rede.feed.distribution.max-fanout=500

# CORS: explicit allowlist. "*" is rejected at boot (CorsConfig); localhost is only added by the dev profile.
rede.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://enois.ia.br,https://enois-qa.b7cloud.tech}

# Gate de origem em TODAS as rotas: navegador manda Origin; chamadas de servidor (SSR, curl,
# integracoes) mandam X-Client-Origin. A origem precisa estar na allowlist acima ou cadastrada em
# /developers/origins. Desligar so para diagnostico local: REDE_ORIGINS_ENFORCE=false.
rede.origins.enforce=${REDE_ORIGINS_ENFORCE:true}

# Origens CONFIAVEIS do app: aceitas em todas as rotas, inclusive /admin e /moderation. Aceita
# curinga de subdominio (https://*.b7cloud.com.br). CORS_ALLOWED_ORIGINS entra sempre.
rede.origins.trusted=${REDE_TRUSTED_ORIGINS:https://*.b7cloud.com.br,https://*.b7cloud.tech,https://enois-qa.b7cloud.tech,https://enois.ia.br,https://api.enois.ia.br}

# Derruba uma origem de terceiro que acumular N respostas 401/403/429 na janela (0 desliga).
rede.origins.suspicious.max-failures=${REDE_ORIGINS_MAX_FAILURES:60}
rede.origins.suspicious.window-seconds=${REDE_ORIGINS_WINDOW_SECONDS:300}
# O bloqueio automático é temporário; o admin pode bloquear permanentemente pelo painel.
rede.origins.suspicious.block-minutes=${REDE_ORIGINS_BLOCK_MINUTES:30}

# Admin agora é a flag imutável users.is_admin (V171). As variáveis antigas de e-mail/username
# não concedem mais acesso; os usernames históricos ficam reservados no código.

# E-mail do time de suporte: recebe os pedidos abertos no app (/admin/support lista todos)
rede.support.email=${SUPPORT_EMAIL:suporte@enois.ia.br}

# Espelho dos pedidos de suporte em issues do GitHub (repositório PRIVADO: o ticket tem PII).
# Sem token/repo o espelho fica desligado e o suporte segue só com e-mail + painel.
rede.support.github.token=${GITHUB_ISSUES_TOKEN:}
rede.support.github.repo=${GITHUB_ISSUES_REPO:}
# Segredo do webhook do repositório; sem ele a rota /webhooks/github recusa tudo.
rede.support.github.webhook-secret=${GITHUB_ISSUES_WEBHOOK_SECRET:}

# Sugestões da comunidade viram issue PÚBLICA depois que um moderador aprova. O token é o MESMO do
# suporte (GITHUB_ISSUES_TOKEN / painel em /admin/support/github) e precisa de escrita em Issues nos
# repositórios abaixo, um por destino (dono/nome). Destino sem repo fica desligado e a sugestão
# continua pendente.
rede.suggestions.github.repo.backend=${GITHUB_SUGGESTIONS_REPO_BACKEND:}
rede.suggestions.github.repo.frontend=${GITHUB_SUGGESTIONS_REPO_FRONTEND:}
rede.suggestions.github.repo.design-system=${GITHUB_SUGGESTIONS_REPO_DESIGN_SYSTEM:}

# O indicador de saude do e-mail fica desligado de proposito: ele abre conexao com o SMTP a cada
# consulta e, com o servidor de e-mail fora do ar (ou bloqueado pela rede do cluster), /actuator/health
# passa a responder 503 — o que derruba liveness/readiness e tira do ar uma aplicacao que esta
# funcionando. Envio de e-mail aqui e melhor esforco: a falha ja e logada e o reset/confirmacao
# continuam valendo pelo token.
management.health.mail.enabled=false

# Chave que cifra em repouso os segredos do segundo fator (TOTP). Gere com:
#   openssl rand -base64 32
# Sem ela o 2FA por aplicativo authenticator fica INDISPONIVEL (erro explicito, nao degrada em
# silencio): guardar segredo de 2FA em texto puro seria pior do que nao oferecer o recurso.
# O 2FA por codigo de e-mail nao depende desta chave.
rede.security.encryption-key=${REDE_SECURITY_ENCRYPTION_KEY:}

# Web Push (notificacoes no celular). Gere as chaves com:
#   npx web-push generate-vapid-keys
# Sem as chaves, o push fica desligado e as notificacoes seguem so dentro do app.
rede.push.vapid.public-key=${VAPID_PUBLIC_KEY:}
rede.push.vapid.private-key=${VAPID_PRIVATE_KEY:}
rede.push.vapid.subject=${VAPID_SUBJECT:mailto:suporte@enois.ia.br}

# Cookie de state do OAuth (Secure exige HTTPS; use false apenas em dev http)
rede.oauth.state-cookie-secure=${OAUTH_STATE_COOKIE_SECURE:true}

# Session TTL (access token)
rede.auth.access-token-ttl-minutes=${AUTH_ACCESS_TOKEN_TTL_MINUTES:60}

# Verificacao de identidade civil. Exigir identidade para publicar vaga fica DESLIGADO por padrao:
# sem um provedor autorizado, ligar bloquearia toda a publicacao. Ligue quando houver provedor.
rede.identity.enforcement-enabled=${IDENTITY_ENFORCEMENT_ENABLED:false}

# Importacao de vagas externas (JobRadar). API oficial: /v1/jobs exige API key (401 sem ela).
# Sem JOBRADAR_API_KEY a fonte fica INDISPONIVEL (fail-safe). NAO usar a API privada /api/* da SPA.
# Sitemap publico (permitido no robots) para LISTAR as vagas e redirecionar. Sem credencial.
rede.jobs.import.jobradar.sitemap-url=${JOBRADAR_SITEMAP_URL:https://jobradar.com.br/sitemap-vagas.xml}
rede.jobs.import.jobradar.user-agent=${JOBRADAR_USER_AGENT:EnóisBot/1.0 (+https://enois.ia.br/developers)}
rede.jobs.import.jobradar.enabled=${JOBRADAR_ENABLED:true}

# Listar vagas externas (JobRadar) na area de vagas, SEMPRE depois das internas. A UI ja mostra
# o selo "Vaga externa" + botao "Visitar vaga" (externa NAO tem candidatura aqui).
rede.jobs.import.external-listing-enabled=${EXTERNAL_JOBS_LISTING_ENABLED:true}
rede.jobs.import.external-listing-limit=${EXTERNAL_JOBS_LISTING_LIMIT:100}

# Atualizacao das vagas externas: em vez de buscar a cada requisicao, ficam salvas no banco e sao
# atualizadas todo dia a meia-noite (cron 0 0 0 * * *).
rede.jobs.import.external-refresh-enabled=${EXTERNAL_JOBS_REFRESH_ENABLED:true}
rede.jobs.import.external-refresh-cron=${EXTERNAL_JOBS_REFRESH_CRON:0 0 0 * * *}
# 0 = TODAS as vagas que a fonte publicar (sem amostra).
rede.jobs.import.external-refresh-limit=${EXTERNAL_JOBS_REFRESH_LIMIT:0}

# Login Unico gov.br (OAuth2/OIDC). Sem client-id/secret/redirect, o provedor fica INDISPONIVEL.
# Homologacao: https://sso.staging.acesso.gov.br | Producao: https://sso.acesso.gov.br
rede.identity.govbr.base-url=${GOVBR_BASE_URL:https://sso.staging.acesso.gov.br}
rede.identity.govbr.client-id=${GOVBR_CLIENT_ID:}
rede.identity.govbr.client-secret=${GOVBR_CLIENT_SECRET:}
rede.identity.govbr.redirect-uri=${GOVBR_REDIRECT_URI:}
rede.auth.refresh-token-ttl-days=${AUTH_REFRESH_TOKEN_TTL_DAYS:30}

# ImageKit CDN
# Storage de midia: `imagekit` (padrao historico) ou `s3` (novo padrao). Virar e so trocar aqui —
# asset antigo continua abrindo pelo endereco que ja esta gravado nele (o fallback e estrutural).
rede.media.storage=${REDE_MEDIA_STORAGE:imagekit}
rede.media.s3.bucket=${REDE_MEDIA_S3_BUCKET:}
rede.media.s3.region=${REDE_MEDIA_S3_REGION:us-east-1}
rede.media.s3.prefix=${REDE_MEDIA_S3_PREFIX:uploads/}
# Vazio = AWS real. Com gateway S3-compativel proprio (ex: object-storage b7cloud), aponta pra ele aqui.
rede.media.s3.endpoint=${REDE_MEDIA_S3_ENDPOINT:}
# Gateways S3-compativeis costumam exigir path-style (https://endpoint/bucket/key), nao virtual-hosted-style.
rede.media.s3.force-path-style=${REDE_MEDIA_S3_FORCE_PATH_STYLE:false}
# Vazio = endereco do bucket; com CloudFront/dominio na frente, e aqui que entra.
rede.media.s3.public-base-url=${REDE_MEDIA_S3_PUBLIC_BASE_URL:}
rede.media.imagekit.url-endpoint=${IMAGEKIT_URL_ENDPOINT:}
rede.media.imagekit.public-key=${IMAGEKIT_PUBLIC_KEY:}
rede.media.imagekit.private-key=${IMAGEKIT_PRIVATE_KEY:}

# Seletor de GIF do comentario. Uma chave basta: o Tenor responde primeiro e o GIPHY entra como
# alternativa quando so ele esta configurado. Sem chave o seletor avisa que a busca esta indisponivel
# e o link colado continua funcionando. Como obter: README, secao "Busca de GIF".
rede.gifs.tenor-key=${REDE_GIFS_TENOR_KEY:}
# Sem default: a chave antiga ficou exposta no repositório e deve ser rotacionada (E-06).
rede.gifs.giphy-key=${REDE_GIFS_GIPHY_KEY:}

# Figurinhas de chat: o catálogo (coleções globais do BTTV/FFZ + mais usadas) é montado AQUI e
# servido de memória, uma página por vez. O navegador nunca chama os provedores — era isso que
# deixava o seletor 20s em "Carregando figurinhas..." quando o FFZ respondia 522.
rede.emotes.refresh-enabled=${REDE_EMOTES_REFRESH_ENABLED:true}
rede.emotes.refresh-cron=${REDE_EMOTES_REFRESH_CRON:0 0 */3 * * *}
# Páginas de 200 do retrato popular (cada página leva de 8 a 30s; só roda no refresh agendado).
rede.emotes.popular-pages=${REDE_EMOTES_POPULAR_PAGES:3}
# Páginas da listagem de figurinhas ANIMADAS do FFZ. É daqui que sai o "tem versão em movimento":
# a listagem popular não publica esse campo, e pedir o arquivo animado de uma figurinha estática
# no CDN do FFZ não devolve 404 — a conexão fica pendurada até o timeout.
rede.emotes.animated-pages=${REDE_EMOTES_ANIMATED_PAGES:2}

# Limite por IP nas rotas de identidade (ver shared/security/IpRateLimiter). O teto vale por pod:
# com N réplicas, o efetivo é N x o valor — suficiente para cortar o ataque barato.
#
# Os números são ALTOS de propósito: um IP não é uma pessoa. Escritório, escola e operadora
# compartilham o mesmo endereço, e um limite apertado puniria gente honesta antes de atrapalhar
# atacante (10 cadastros/hora e 60 entradas/15min cabem numa empresa; uma enxurrada de script, não).
rede.security.rate-limit.signup.limit=${SIGNUP_RATE_LIMIT:10}
rede.security.rate-limit.signup.window-minutes=60
rede.security.rate-limit.login.limit=${LOGIN_RATE_LIMIT:60}
rede.security.rate-limit.login.window-minutes=15
rede.security.rate-limit.password.limit=${PASSWORD_RATE_LIMIT:5}
rede.security.rate-limit.password.window-minutes=15
rede.security.rate-limit.email.limit=${EMAIL_RATE_LIMIT:5}
rede.security.rate-limit.email.window-minutes=15
rede.security.rate-limit.2fa.limit=${TWO_FACTOR_RATE_LIMIT:20}
rede.security.rate-limit.2fa.window-minutes=15
# Session refresh: one per access-token lifetime per person, so a NAT still fits comfortably.
rede.security.rate-limit.refresh.limit=${REFRESH_RATE_LIMIT:120}
rede.security.rate-limit.refresh.window-minutes=15
# Formulário público de contribuição da landing: 5 por hora por IP.
rede.security.rate-limit.contribution.limit=${CONTRIBUTION_RATE_LIMIT:5}
rede.security.rate-limit.contribution.window-minutes=60

# IPs do proxy reverso que ficam na frente da app (ver ClientIpResolver#isTrustedProxy). Sem isto,
# só loopback/RFC1918 é confiavel — valia para o ALB antigo (IP interno de cluster), mas o Traefik
# de docker-prod3 conecta pelo IP publico dele (31.220.102.169), que cai fora dessas faixas: sem
# isto configurado, o X-Forwarded-For e sempre ignorado e todo rate-limit/bloqueio por IP via no
# proprio IP do Traefik, nunca no cliente real. Lista separada por virgula, vazio por default.
security.trusted-proxy-ips=${TRUSTED_PROXY_IPS:}
# IPs or CIDRs, comma separated. Loopback and private ranges are always trusted. CF-Connecting-IP is
# honoured only when the hop our proxy saw is a Cloudflare edge (security.cloudflare-ips, defaults to
# Cloudflare's published ranges); no other client header (X-Real-IP, ...) is ever read.

# Captcha do cadastro. O Turnstile (Cloudflare) assume quando TURNSTILE_SITE_KEY e
# TURNSTILE_SECRET_KEY existem; sem elas, o cadastro usa o desafio de soma assinado do backend.
# Assim existe proteção mesmo antes de criar a conta no Cloudflare.
rede.turnstile.site-key=${TURNSTILE_SITE_KEY:}
rede.turnstile.secret-key=${TURNSTILE_SECRET_KEY:}
# Chaves de TESTE do Cloudflare (1x000.../2x000.../3x000...) aceitam QUALQUER token, entao nunca
# contam como captcha ativo: o cadastro sempre cai no desafio proprio do backend nesse caso.
# O que resta decidir e o que fazer com o boot, e isso e configuravel por ambiente:
#   degrade (default) - sobe normal, com ERROR no log dizendo que o captcha externo esta desligado.
#   fatal             - recusa o boot (garantia dura: nunca rodar sem captcha real).
# Um valor escrito errado nunca derruba o site: cai em degrade e avisa no log.
rede.turnstile.test-key-policy=${TURNSTILE_TEST_KEY_POLICY:degrade}
rede.security.signup-captcha-enabled=${SIGNUP_CAPTCHA_ENABLED:true}

# Triagem de contas suspeitas (painel admin). Os padrões de nome são separados por vírgula.
rede.security.suspicious.days=${SUSPICIOUS_DAYS:90}
rede.security.suspicious.name-patterns=${SUSPICIOUS_NAME_PATTERNS:probe}

# Teto específico de POST por usuário e por IP (janela de 1 minuto; vale por pod).
rede.rate.post-guard-enabled=${POST_GUARD_ENABLED:true}
rede.rate.post-user-per-minute=${POST_USER_RATE_LIMIT:120}
rede.rate.post-ip-per-minute=${POST_IP_RATE_LIMIT:300}

# Automação de contenção da triagem de contas suspeitas: risco ACIMA do teto vira banimento com
# sanitização. O teto era 60 e subiu para 80 em 2026-10-30 (decisão da dona: sinais fracos somados
# — nome repetido, perfil vazio, conta nova — já bastavam para banir). 80 exato continua sendo
# decisão humana; a automação só age no que passa do teto.
rede.moderation.auto-ban.risk=${MODERATION_AUTO_BAN_RISK:80}

# Pré-triagem determinística antes do LLM: denúncia sem sinal não gasta chamada de IA.
rede.moderation.pretriage.enabled=${MODERATION_PRETRIAGE_ENABLED:true}
rede.moderation.pretriage.min-score=${MODERATION_PRETRIAGE_MIN_SCORE:30}
rede.moderation.pretriage.duplicate-target-window-hours=24

# Honeypot em escrita autenticada: campo invisível preenchido = ban automático.
rede.security.honeypot-auto-ban=${HONEYPOT_AUTO_BAN:true}

# Fechamento da suspensão com prazo: graça em dias antes de virar banimento definitivo.
rede.moderation.suspension.grace-days=${SUSPENSION_GRACE_DAYS:7}
rede.moderation.suspension.expiry-enabled=${SUSPENSION_EXPIRY_ENABLED:true}

# OAuth SSO
rede.oauth.frontend-redirect-url=
rede.oauth.linkedin.client-id=${LINKEDIN_CLIENT_ID:77oxnpfdt2gttd}
rede.oauth.linkedin.client-secret=${LINKEDIN_CLIENT_SECRET:}
rede.oauth.linkedin.redirect-uri=${LINKEDIN_REDIRECT_URI:https://enois.ia.br/auth/callback?provider=LINKEDIN}
rede.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
rede.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
rede.oauth.google.redirect-uri=${GOOGLE_REDIRECT_URI:https://enois.ia.br/auth/callback?provider=GOOGLE}
rede.oauth.apple.client-id=
rede.oauth.apple.team-id=
rede.oauth.apple.key-id=
rede.oauth.apple.private-key=
rede.oauth.apple.redirect-uri=
# GitHub OAuth: usado apenas para VINCULAR a conta (não cria conta nova).
rede.oauth.github.client-id=${GITHUB_CLIENT_ID:}
rede.oauth.github.client-secret=${GITHUB_CLIENT_SECRET:}
rede.oauth.github.redirect-uri=${GITHUB_REDIRECT_URI:}

# Selos de contribuição. O token é fine-grained, somente leitura dos repositórios públicos; sem
# token a API pública funciona com limite baixo. PR integrado conta automaticamente; issue só conta
# com label qualificadora (lista abaixo) ou validação de mantenedor. A sincronização automática
# nasce desligada: o primeiro backfill é manual e revisado.
# Convites para contatos importados do LinkedIn (Connections.csv): botão + worker de continuação.
rede.linkedin.contact-invites.worker-enabled=${LINKEDIN_CONTACT_INVITES_WORKER:true}
rede.linkedin.contact-invites.worker-delay-ms=${LINKEDIN_CONTACT_INVITES_DELAY_MS:900000}
rede.linkedin.contact-invites.max-per-run=${LINKEDIN_CONTACT_INVITES_MAX_PER_RUN:200}
rede.github.api-base=${GITHUB_API_BASE:https://api.github.com}
rede.github.token=${GITHUB_CONTRIBUTIONS_TOKEN:}
rede.github.user-agent=${GITHUB_USER_AGENT:EnoisBot/1.0 (+https://enois.ia.br/developers)}
rede.github.max-pages=${GITHUB_SYNC_MAX_PAGES:3}
rede.github.max-details-per-run=${GITHUB_SYNC_MAX_DETAILS:60}
rede.github.qualified-issue-labels=${GITHUB_QUALIFIED_ISSUE_LABELS:}
rede.github.sync-enabled=${GITHUB_SYNC_ENABLED:false}
rede.github.sync-cron=${GITHUB_SYNC_CRON:0 */10 * * * *}
rede.github.sync-on-link-enabled=${GITHUB_SYNC_ON_LINK_ENABLED:true}

# Email Configuration
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:suporte@enois.ia.br}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Frontend URL
rede.frontend.url=${FRONTEND_URL:http://localhost:5173}
# Base pública da API (links de e-mail que precisam voltar ao backend, ex.: confirmar novo e-mail).
rede.backend.url=${REDE_BACKEND_URL:https://api.enois.ia.br}
# Pre-triagem de denuncias por LLM. A chave vem do segredo de ambiente
# (MODERATION_LLM_API_KEY) e nunca fica em arquivo versionado.
rede.moderation.llm.base-url=${MODERATION_LLM_BASE_URL:https://infer.flatt.com.br/v1}
rede.moderation.llm.api-key=${MODERATION_LLM_API_KEY:}
rede.moderation.llm.model=${MODERATION_LLM_MODEL:qwen3.8-27b}
rede.moderation.ai.triage-enabled=${MODERATION_AI_TRIAGE_ENABLED:true}
rede.moderation.ai.auto-penalty-enabled=${MODERATION_AI_AUTO_PENALTY:true}
# Checagem de conteúdo sexual na MÍDIA enviada. O modelo olha a imagem (o texto do post não é a
# prova); violação confirmada derruba a imagem de todos os posts que a usam e bane a conta. O gancho
# roda na publicação e a varredura cobre o que escapar (janela de lookback-hours, lote de sweep-batch).
rede.moderation.media.enabled=${MODERATION_MEDIA_ENABLED:true}
rede.moderation.media.sweep-batch=${MODERATION_MEDIA_SWEEP_BATCH:25}
rede.moderation.media.lookback-hours=${MODERATION_MEDIA_LOOKBACK_HOURS:72}
rede.moderation.media.interval-ms=${MODERATION_MEDIA_INTERVAL_MS:300000}
rede.moderation.media.initial-delay-ms=${MODERATION_MEDIA_INITIAL_DELAY_MS:45000}
# Barreira do DESTINO dos links publicados: o texto pode ser inocente e o link levar a pornografia.
# O destino é lido (titulo e descricao da propria pagina) e classificado; violação confirmada derruba
# o post e a conta. Host de plataforma adulta é conclusivo e nem precisa de visita. `retry-hours` é o
# descanso antes de revisitar um destino que não deu para julgar (fora do ar, sem descrição).
rede.moderation.links.enabled=${MODERATION_LINKS_ENABLED:true}
rede.moderation.links.sweep-batch=${MODERATION_LINKS_SWEEP_BATCH:15}
rede.moderation.links.lookback-hours=${MODERATION_LINKS_LOOKBACK_HOURS:72}
rede.moderation.links.retry-hours=${MODERATION_LINKS_RETRY_HOURS:24}
rede.moderation.links.interval-ms=${MODERATION_LINKS_INTERVAL_MS:300000}
rede.moderation.links.initial-delay-ms=${MODERATION_LINKS_INITIAL_DELAY_MS:60000}
# Conteúdo automatizado (bot/IA publicando como se fosse gente). A rede é para gente: o post entra
# em QUARENTENA (some do feed, do perfil e do detalhe), vira caso na fila de revisão e o autor é
# avisado. Nada é apagado e ninguém é punido por esta via — liberar ou remover é decisão humana.
rede.moderation.automation.enabled=${MODERATION_AUTOMATION_ENABLED:true}
rede.moderation.automation.sweep-batch=${MODERATION_AUTOMATION_SWEEP_BATCH:20}
rede.moderation.automation.lookback-hours=${MODERATION_AUTOMATION_LOOKBACK_HOURS:72}
rede.moderation.automation.interval-ms=${MODERATION_AUTOMATION_INTERVAL_MS:600000}
rede.moderation.automation.initial-delay-ms=${MODERATION_AUTOMATION_INITIAL_DELAY_MS:90000}
# Denúncia por conteúdo SEXUAL em post: caminho próprio, porque aqui a espera É o dano. O post sai
# do ar na hora (quarentena, não apagamento) e o bot decide primeiro: NSFW confirmado (mesmo gate:
# sem ambiguidade + confiança >= 0.7) apaga de vez, seguro devolve ao feed, e qualquer dúvida —
# inclusive modelo fora do ar — fica com uma pessoa na fila da quarentena. Nenhuma saída pune a
# conta. Desligar aqui faz a denúncia sexual voltar a ser uma denúncia comum.
rede.moderation.sexual.enabled=${MODERATION_SEXUAL_ENABLED:true}
# Automod de SPAM/FLOOD sem denúncia: flood (N posts numa janela), o mesmo texto repetido, ou uma
# sequência de posts praticamente vazios levantam a suspeita — a IA decide (mesmo gate: PENALIZAR +
# sem ambiguidade + confiança >= 0.7); sem veredito, nada é apagado. RESTRIÇÃO no caso normal, BAN
# quando o flood é massivo (>= auto-ban-threshold na janela). Admin/moderador fica fora.
rede.moderation.spam.enabled=${MODERATION_SPAM_ENABLED:true}
rede.moderation.spam.min-length=${MODERATION_SPAM_MIN_LENGTH:3}
rede.moderation.spam.flood-window-minutes=${MODERATION_SPAM_FLOOD_WINDOW_MINUTES:10}
rede.moderation.spam.flood-threshold=${MODERATION_SPAM_FLOOD_THRESHOLD:8}
rede.moderation.spam.repeat-threshold=${MODERATION_SPAM_REPEAT_THRESHOLD:3}
rede.moderation.spam.short-flood-threshold=${MODERATION_SPAM_SHORT_FLOOD_THRESHOLD:8}
rede.moderation.spam.lookback-hours=${MODERATION_SPAM_LOOKBACK_HOURS:168}
rede.moderation.spam.sanitize-limit=${MODERATION_SPAM_SANITIZE_LIMIT:50}
rede.moderation.spam.auto-ban-threshold=${MODERATION_SPAM_AUTO_BAN_THRESHOLD:20}

# Varredura de conteúdo pelo padrão do ataque (incidente 22/10: o atacante trocava o endpoint).
# tabela:coluna_autor[:coluna_rotulo] — sem rótulo, a limpeza é só por autor.
rede.security.attack-purge.entities=${ATTACK_PURGE_ENTITIES:communities:created_by:name,groups:owner_id:name,jobs:posted_by:title,events:created_by:title,companies:owner_user_id:name,service_listings:seller_id:title,freelances:user_id:title,blogs:user_id,theme_gallery:author_id:name,community_projects:user_id:title,games:user_id:title}
# filha:coluna_fk:tabela_pai — apagadas antes do pai (FK).
rede.security.attack-purge.children=${ATTACK_PURGE_CHILDREN:community_members:community_id:communities,group_members:group_id:groups,group_join_requests:group_id:groups,job_skills:job_id:jobs,job_applications:job_id:jobs,job_saves:job_id:jobs,event_attendees:event_id:events}
rede.security.attack-purge.max-authors=${ATTACK_PURGE_MAX_AUTHORS:50}
# Vocabulário aprendido com o ataque de 22/10 nos serviços/marketplace (títulos e descrições,
# não só o nome da conta). A varredura já existente lê esta lista e os alvos abaixo.
rede.moderation.content-sweep.patterns=${CONTENT_SWEEP_PATTERNS:probe,idor,redteam,red team,duplo aceite,reembolso integral,teste de escrow,autorizacao de objetos,contrato para testar,msm}
# tabela:coluna_dono:coluna_id:texto1|texto2:coluna_data
rede.moderation.content-sweep.targets=${CONTENT_SWEEP_TARGETS:service_listings:seller_id:id:title|description:created_at;service_requests:requester_id:id:title|description:created_at;communities:created_by:id:name|description:created_at;events:created_by:id:title|host:created_at;freelances:user_id:id:title|scope:created_at}


# Modo pânico também pode nascer LIGADO pela variável de ambiente PANIC_MODE (emergência).
# `yes`/`true`/`on`/`1` = leitura apenas; VAZIO/ausente = online (o botão do painel decide).
# Com a env ligada, é override duro: o painel não desliga até a variável sair.
rede.panic.env-enabled=${PANIC_MODE:}

# Monitorabilidade do painel admin: arquivo JSONL diário na VPS (SEM banco: a observabilidade
# nunca disputa o pool com os usuários). Retenção em dias; rotação apaga os dias além dela.
rede.monitoring.file-dir=${REDE_MONITORING_FILE_DIR:/app/data/monitoring}
rede.monitoring.retention-days=${REDE_MONITORING_RETENTION_DAYS:7}
# Teto de eventos persistidos por minuto (o restante continua nas métricas, mas é descartado).
rede.monitoring.max-events-per-minute=${REDE_MONITORING_MAX_EVENTS_PER_MINUTE:1000}

# Economia automática da faísca: a cotação de referência é recalculada a cada 3 HORAS a partir do
# uso real (escrow de marketplace/serviços + transferências P2P) e da emissão automática na janela,
# com passo máximo de 1% por execução, piso de 1 centavo e teto de R$ 1,00 por faísca. No 1º dia de
# cada mês a rodada COMPLETA recalcula o preço do zero (âncora × índice da janela de 30 dias),
# sem partir do último valor e sem o limite de passo — é a validação de referência da cotação.
rede.coin.economy.enabled=${COIN_ECONOMY_ENABLED:true}
rede.coin.economy.cron=${COIN_ECONOMY_CRON:0 10 */3 * * *}
rede.coin.economy.zone=${COIN_ECONOMY_ZONE:America/Sao_Paulo}
# Rodada completa mensal: 03:40 do dia 1º (depois da primeira rodada suave do dia).
rede.coin.economy.monthly-cron=${COIN_ECONOMY_MONTHLY_CRON:0 40 3 1 * *}
# Âncora da rodada completa: a cotação inicial (1 centavo = 10.000 micro-reais) × índice da janela.
rede.coin.economy.anchor-micros=${COIN_ECONOMY_ANCHOR_MICROS:10000}
rede.coin.economy.period-hours=${COIN_ECONOMY_PERIOD_HOURS:3}
rede.coin.economy.window-days=${COIN_ECONOMY_WINDOW_DAYS:30}
# Giro considerado saudável na janela (5% do estoque em circulação usado no período = neutro).
rede.coin.economy.target-turnover=${COIN_ECONOMY_TARGET_TURNOVER:0.05}
# P2P é circulação, não consumo: entra com peso menor no cálculo.
rede.coin.economy.p2p-weight=${COIN_ECONOMY_P2P_WEIGHT:0.5}
# Teto de uso por janela (múltiplo do estoque) — limita ping-pong entre contas.
rede.coin.economy.max-usage-ratio=${COIN_ECONOMY_MAX_USAGE_RATIO:1.0}
# Escassez: quanto menos faíscas no cofre em relação ao total, mais o giro pressiona o valor.
rede.coin.economy.scarcity-weight=${COIN_ECONOMY_SCARCITY_WEIGHT:0.5}
rede.coin.economy.sensitivity=${COIN_ECONOMY_SENSITIVITY:0.25}
rede.coin.economy.max-step=${COIN_ECONOMY_MAX_STEP:0.01}
rede.coin.economy.min-micros=${COIN_ECONOMY_MIN_MICROS:1000}
rede.coin.economy.max-micros=${COIN_ECONOMY_MAX_MICROS:1000000}

# Eventos grátis da loja de cosméticos (horário de America/Sao_Paulo, início e fim inclusivos).
# A QA move a janela por variável de ambiente para testar antes do dia.
rede.cosmetics.events.duel.starts-at=${COSMETICS_DUEL_STARTS_AT:2026-10-31T00:00:00}
rede.cosmetics.events.duel.ends-at=${COSMETICS_DUEL_ENDS_AT:2026-10-31T23:59:59}
rede.cosmetics.events.hunt.starts-at=${COSMETICS_HUNT_STARTS_AT:2026-10-31T00:00:00}
rede.cosmetics.events.hunt.ends-at=${COSMETICS_HUNT_ENDS_AT:2026-10-31T23:59:59}

# Study pairs: weekly check-in reminder (Spring cron, America/Sao_Paulo; "-" disables).
rede.study-pairs.reminder-cron=${STUDY_PAIRS_REMINDER_CRON:0 0 18 * * THU}

# Rituais (eventos recorrentes): de hora em hora, a ocorrencia que ja terminou agenda a proxima da
# serie e avisa quem tinha confirmado presenca (horario de America/Sao_Paulo).
rede.events.recurrence.enabled=${EVENTS_RECURRENCE_ENABLED:true}
rede.events.recurrence.cron=${EVENTS_RECURRENCE_CRON:0 20 * * * *}
rede.events.recurrence.zone=${EVENTS_RECURRENCE_ZONE:America/Sao_Paulo}

# Weekly digest e-mail (notifications/WeeklyDigestService, docs/DIGEST.md): Monday 09:00 in Sao Paulo,
# bounded pages of recipients, one e-mail per person per ISO week.
rede.digest.enabled=${DIGEST_ENABLED:true}
rede.digest.cron=${DIGEST_CRON:0 0 9 * * MON}
rede.digest.zone=${DIGEST_ZONE:America/Sao_Paulo}
rede.digest.batch-size=${DIGEST_BATCH_SIZE:200}
