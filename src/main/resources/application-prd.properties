spring.datasource.url=jdbc:mysql://localhost:3306/rede_prd?useSSL=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=rede_prd
spring.datasource.password=${DB_PASSWORD}
# Production runs MariaDB (bare-metal), so the dialect must be MariaDB's. With MySQLDialect (and no
# JDBC metadata on boot, see application.properties) Hibernate assumes MySQL 8 and renders pessimistic
# locks as `for update of <alias>`, which MariaDB rejects: every @Lock(PESSIMISTIC_WRITE) query failed.
# Guarded by PessimisticLockSqlTests.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Pool de conexoes: 10 (default) esgotava com 30 scheduled tasks + requests de usuario.
# 30 conexoes cobrem os workers + trafego normal. O MariaDB bare-metal aguenta 150+.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:30}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:10}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.validation-timeout=5000

# Produção não confia em localhost (E-31); só a origem explícita do frontend.
rede.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://enois.ia.br,https://isweee.com}
# isweee.com espelha o app; enois.ia.br continua o principal (canonical, e-mails, URLs configuradas).
rede.site.domains=${SITE_DOMAINS:enois.ia.br,isweee.com}

# OAuth SSO - production
rede.oauth.frontend-redirect-url=${REDE_FRONTEND_URL}/auth/callback
rede.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
rede.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
rede.oauth.google.redirect-uri=${REDE_BACKEND_URL}/api/auth/oauth/google/callback
rede.oauth.apple.client-id=${APPLE_CLIENT_ID:}
rede.oauth.apple.team-id=${APPLE_TEAM_ID:}
rede.oauth.apple.key-id=${APPLE_KEY_ID:}
rede.oauth.apple.private-key=${APPLE_PRIVATE_KEY:}
rede.oauth.apple.redirect-uri=${REDE_BACKEND_URL}/api/auth/oauth/apple/callback

# Migrations escritas em paralelo (branchs/sessoes concorrentes) podem ter numero MENOR que uma ja
# aplicada — foi o que aconteceu entre a triagem por IA (V45) e o artigo (V46). Com o padrao
# (out-of-order=false) o Flyway RECUSA a migracao pendente e o pod nao sobe, e o cluster fica
# servindo a versao antiga em silencio. O perfil de QA ja tinha isso pelo mesmo motivo; prod e hml
# nao tinham, e era a causa do backend parar de subir.
spring.flyway.out-of-order=true

# Validacao de checksum DESLIGADA, igual ao qa. Motivo concreto: uma migracao JA APLICADA que teve o
# conteudo editado depois (a V36 passou de varchar(12000) para longtext) faz o Flyway recusar o boot
# com "Migration checksum mismatch" — e o mesmo codigo sobe numa base limpa, o que faz o erro parecer
# misterio. Aqui a ordem ja e tolerada (out-of-order acima); este e o outro lado da tolerancia.
spring.flyway.validate-on-migrate=false

# Cadastros ABERTOS com captcha + confirmacao de e-mail ANTES de criar a conta (2026-10-21):
# o POST /auth/signup guarda em pending_signups e envia o link; a conta so nasce na confirmacao.
# Fechar de novo: REDE_AUTH_SIGNUP_ENABLED=false (responde 403 SIGNUP_DISABLED).
rede.auth.signup-enabled=${REDE_AUTH_SIGNUP_ENABLED:true}

# JSON logs (ECS) em uma linha por evento: CloudWatch Logs Insights filtra por campo
# (requestId, traceId, clientIp, userId, http.route, http.status...). Também serve Loki/Grafana.
logging.structured.format.console=ecs
logging.structured.ecs.service.environment=prd
