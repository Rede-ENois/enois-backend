# Lido pelo SpringProperties (raiz do classpath), NAO pelo application.properties: o cache de
# contextos do Spring Test consulta esta chave antes de qualquer ApplicationContext existir.
# A base dos testes e uma H2 em memoria NOMEADA (`jdbc:h2:mem:rede`) que vive enquanto a aplicacao
# estiver de pe: fechar o ultimo pool derruba a base inteira, e todo contexto criado depois abre
# uma H2 vazia. O cache LRU (32 por padrao) descartava contextos no meio da suite e esse descarte
# fechava a base — os testes seguintes falhavam com "The database has been closed", devolvido como
# 409 pelo handler de integridade. A suite roda num processo so; o cache cabe na memoria.
spring.test.context.cache.maxSize=1000
