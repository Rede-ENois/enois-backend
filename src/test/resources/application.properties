spring.profiles.active=dev

# Email Configuration
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:noreply@socialcoisa.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

rede.frontend.url=${FRONTEND_URL:}

# Test Rate Limiting
resilience4j.ratelimiter.instances.auth.limit-for-period=1000
resilience4j.ratelimiter.instances.search.limit-for-period=1000