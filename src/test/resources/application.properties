spring.profiles.active=dev

# Email Configuration
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:suporte@enois.ia.br}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

rede.frontend.url=${FRONTEND_URL:}

# ATENCAO: este arquivo tem o mesmo nome do src/main/resources/application.properties, entao ele
# SOMBREIA o do main no classpath de teste (o Spring carrega apenas o primeiro encontrado). Tudo que
# for essencial para o teste precisa estar declarado aqui — nao ha merge com o do main.

# O teste nao tem SMTP: sem desligar o indicador, /actuator/health responde 503 e o teste de contrato
# do actuator quebra por um motivo que nao e o que ele esta verificando.
management.health.mail.enabled=false

# Chave fixa de teste para cifrar segredos do segundo fator (32 bytes em base64).
rede.security.encryption-key=9uQ2mZ0Kx8Vn3v5m1Yb7Qe4Tt6Wc8Vb0Nn2MmL4Kp1U=

# Admin de teste: o papel real é users.is_admin (V170); a allowlist por e-mail só existe quando
# o bootstrap de teste está ligado — em produção o default é false e ela não concede nada.
rede.admin.bootstrap-enabled=true
rede.admin.emails=group-admin@test.com

# ESPELHO da configuração de upload do main (este arquivo sombreia o do main). Sem estas linhas o
# teste roda com o padrão do Boot (1 MB) e não verifica a configuração real do import do LinkedIn.
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=16MB

# Os testes criam dezenas de contas do mesmo "IP" (o MockMvc não tem um): limite alto aqui, como já
# é feito com o resilience4j. O teste do limitador (IdentityRateLimitTests) aperta os valores por
# @DynamicPropertySource, então o comportamento real continua coberto.
rede.security.rate-limit.signup.limit=1000
rede.security.rate-limit.login.limit=1000
rede.security.rate-limit.password.limit=1000
rede.security.rate-limit.email.limit=1000
rede.security.rate-limit.2fa.limit=1000
rede.security.rate-limit.contribution.limit=1000
rede.security.rate-limit.refresh.limit=1000

# O throttle por conta/IP (AuthThrottle) também abre na suíte: as contas nascem todas do mesmo
# "IP" (o MockMvc não tem um). O teste do throttle aperta os valores por @DynamicPropertySource.
rede.auth.throttle.login-max-failures=1000
rede.auth.throttle.signup-per-hour=1000

# Test Rate Limiting
resilience4j.ratelimiter.instances.auth.limit-for-period=1000
resilience4j.ratelimiter.instances.search.limit-for-period=1000
resilience4j.ratelimiter.instances.email-sending.limit-for-period=1000

# Atencao: as propriedades deste arquivo sao sobrescritas pelas do perfil ativo
# (application-dev.properties). O que precisa vencer um valor do perfil vai em
# @TestPropertySource na propria classe de teste.

# Testes: sem importacao de vagas externas (nao bate na rede nem roda o worker paralelo).
rede.jobs.import.jobradar.enabled=false
rede.jobs.import.external-refresh-enabled=false
# Catalogo de figurinhas: o boot nao sai para a rede do provedor durante o teste (o embarcado basta).
rede.emotes.refresh-enabled=false
rede.moderation.ai.triage-enabled=false

# O worker de posts agendados nao pode disparar no meio dos testes: o teste chama publishDue()
# na hora que quer e uma rodada paralela do agendador tornaria as tentativas nao deterministicas.
rede.feed.schedule-delay-ms=3600000

# Acoes que alimentam credibilidade nao podem bater no teto durante a suite (que cria relacoes,
# denuncias e recomendacoes em lote); o comportamento real tem teste proprio.
rede.moderation.reports-per-hour=1000
rede.profile.recommendations-per-day=1000

# O job de ranking nao precisa rodar durante os testes (delay enorme).
rede.reputation.refresh-delay-ms=3600000
rede.reputation.refresh-initial-delay-ms=3600000

# O comunicado de recuperacao do armazenamento NUNCA dispara sozinho na suite (teste chama na mao).
rede.communications.recovery-delay-ms=3600000
rede.communications.recovery-initial-delay-ms=3600000

# SMTP da suite nao existe: falhar RAPIDO (o padrao do JavaMail e timeout infinito, e o teste
# da newsletter esperava mais do que o envio real).
spring.mail.properties.mail.smtp.connectiontimeout=1000
spring.mail.properties.mail.smtp.timeout=1000
spring.mail.properties.mail.smtp.writetimeout=1000

# Limites de taxa folgados em teste: os testes de integracao publicam dezenas de posts/mensagens
# no mesmo processo e o UserRateLimiter e em memoria (o estado vazaria entre testes). O comportamento
# de 429 em si e coberto pelo teste unitario do limitador, nao pelos de integracao.
rede.rate.post-limit=100000
rede.rate.comment-limit=100000
rede.rate.message-limit=100000
rede.rate.job-apply-limit=100000
rede.rate.global-per-minute=100000
# O cooldown de conta nova (seguranca da cadeia 1-3) rejeita publish segundos apos o signup de teste.
rede.security.new-account-cooldown-seconds=0
# Deduplicacao de conteudo desligada em teste: os testes de limite/compartilhamento publicam o
# mesmo texto de proposito varias vezes na mesma hora.
rede.rate.duplicate-window-minutes=0


# O captcha de cadastro e o teto de POST teriam de ser resolvidos em cada helper de teste; os
# testes específicos ligam as duas proteções por @TestPropertySource e cobrem o comportamento real.
rede.security.signup-captcha-enabled=false
rede.rate.post-guard-enabled=false

# A defesa contra varredura fica LIGADA na suite, mas com teto alto: uma classe de teste que
# exercita 401/404 de proposito (a suite faz isso o tempo todo) nao pode derrubar as seguintes.
# O comportamento de verdade (bloqueio, prazo e reincidencia) tem teste proprio, com relogio movel.
rede.security.abuse.max-errors=1000
# A triagem automática (SuspiciousAutoBanWorker) bane por risco: na suíte ela derrubaria as contas
# "probe..." criadas por outros testes. Os testes dela chamam sweep() na mão.
rede.moderation.auto-ban.enabled=false

# O lote de banimento bloqueia o IP repetido em 2+ contas. Na suíte TODAS as requisições vêm de
# 127.0.0.1: bloquear ali derrubaria os logins dos testes seguintes. O bloqueio tem teste próprio
# (BulkBanIpBlockTests) ligando a flag só naquele cenário.
rede.moderation.bulk-ban.block-ips=false

# O portão de cadastro por padrão de ataque recusa nomes com "probe" E bloqueia o IP de origem.
# A suíte cria dezenas de contas "probe..." de 127.0.0.1: ligado aqui, o primeiro cadastro
# fecharia o IP e derrubaria todo mundo. O cenário do portão é SuspiciousSignupGuardTests, que
# liga a flag no próprio contexto e limpa a linha de blocked_ips no fim.
rede.security.signup-guard-enabled=false

# Espelho da varredura por módulo (este arquivo sombreia o do main — ver comentário no topo).
rede.security.attack-purge.entities=communities:created_by:name,groups:owner_id:name,jobs:posted_by:title,events:created_by:title,companies:owner_user_id:name,service_listings:seller_id:title,freelances:user_id:title,blogs:user_id,theme_gallery:author_id:name,community_projects:user_id:title,games:user_id:title
rede.security.attack-purge.children=community_members:community_id:communities,group_members:group_id:groups,group_join_requests:group_id:groups,job_skills:job_id:jobs,job_applications:job_id:jobs,job_saves:job_id:jobs,event_attendees:event_id:events
rede.auth.pending-signup-cleanup-enabled=false

# O MockMvc nao manda Origin/X-Client-Origin; o gate global tem teste proprio
# (DeveloperOriginTests liga a enforcement por @SpringBootTest properties).
rede.origins.enforce=false

# Evita chamadas reais ao GitHub durante testes de OAuth.
rede.github.sync-on-link-enabled=false

# O resumo semanal nunca dispara sozinho na suite: o teste chama sendTo/runWeekly na mao.
rede.digest.enabled=false
rede.digest.cron=0 0 9 * * MON
rede.digest.zone=America/Sao_Paulo
rede.digest.batch-size=200
