openapi: 3.0.3
info:
  title: Events list/detail — viewer attendance
  version: "001"
paths:
  /events:
    get:
      summary: List events
      parameters:
        - in: header
          name: X-Session-Token
          required: false
          schema:
            type: string
        - in: query
          name: format
          schema:
            type: string
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: includePast
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Page of EventView
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "./event-view.json"
                  nextCursor:
                    type: string
                    nullable: true
  /events/{eventId}:
    get:
      summary: Event detail
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: string
        - in: header
          name: X-Session-Token
          required: false
          schema:
            type: string
      responses:
        "200":
          description: EventView
          content:
            application/json:
              schema:
                $ref: "./event-view.json"
