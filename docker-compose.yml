services:
  rede:
    build: .
    container_name: rede
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/api/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 180s
    volumes:
      - h2_data:/app/data

  mariadb:
    image: mariadb:11
    profiles: ["hml"]
    container_name: rede-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: rede_hml
      MARIADB_USER: rede_hml
      MARIADB_PASSWORD: rede_hml
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  mysql:
    image: mysql:8
    profiles: ["prd"]
    container_name: rede-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rede_prd
      MYSQL_USER: rede_prd
      MYSQL_PASSWORD: rede_prd
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  h2_data:
  mariadb_data:
  mysql_data:
